<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kiểm tra máy và QLCL in PVC</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font tải nền, không chặn việc hiện trang; trong lúc chờ dùng font có sẵn của máy -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one narrow working column (phone at the machine first), sticky header with account + tabs,
   each tab is a stack of plain panels; the monthly grid mirrors the paper form (day rows x shift columns). */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#141a2d; --muted:#5a6379; --line:#d8ddea;
  --accent:#2440b3; --accent-ink:#ffffff; --accent-soft:#e5eafb;
  --ok:#12733f; --ok-soft:#dcf2e5; --ng:#bb261e; --ng-soft:#fde3e0; --wait:#8c5a08; --wait-soft:#fbedd0;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --jp:"Hiragino Sans","Yu Gothic","Noto Sans JP","Be Vietnam Pro",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark }

*{box-sizing:border-box}
/* Giao diện cố định trên điện thoại: không phóng to khi chạm 2 lần, không chụm để zoom, không tự zoom khi chạm vào ô nhập */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{overflow-x:hidden;touch-action:pan-x pan-y;overscroll-behavior-x:none}
button,.btn,.slot,.okng button,.tabs button,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.slot,.chip,.role,.tabs{-webkit-user-select:none;user-select:none}
/* iOS tự phóng to khi chạm vào ô nhập có chữ nhỏ hơn 16px: ép mọi ô nhập luôn 16px ở mọi cỡ màn hình */
input,select,textarea,input[type=text],input[type=password],input[type=month],input[type=time]{font-size:16px !important}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.top-in{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.brand{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brandL{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 220px}
.brandL .logo{flex:none;height:48px;width:auto;background:#fff;border-radius:6px;padding:2px}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opbtn{font:inherit;font-size:17px;font-weight:600;padding:18px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;min-height:64px}
.opbtn:active{background:var(--accent-soft);border-color:var(--accent)}
.pinbox{display:grid;gap:12px;max-width:320px}
.pinname{font-size:20px;font-weight:700}
#opPin{font-family:var(--mono);font-size:28px !important;letter-spacing:.5em;text-align:center}
.opbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.who .role.op{background:var(--ok-soft);color:var(--ok)}
.ltable{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1.2fr) minmax(0,1.3fr) 142px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--surface)}
.lrow.saved{border-left-color:var(--ok)} .lrow.dirty,.lrow.new{border-left-color:var(--wait)}
.lrow.lhead{border:0;padding:0 10px 0 14px;background:none;font-size:12px;color:var(--muted);font-weight:600}
.lrow select,.lrow input{width:100%;min-width:0;padding:8px 8px;min-height:40px}
.lc{min-width:0}
.lq{display:flex;gap:6px}
.qi{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.qi input{min-width:52px}
.qi input{text-align:center;font-family:var(--mono);padding:8px 4px}
.qi span{font-size:12px;color:var(--muted)}
.lact{display:flex;gap:6px;justify-content:flex-end}
.lmeta{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.lrow.dirty .lmeta,.lrow.new .lmeta{color:var(--wait)}
.ml{display:none;font-size:12px;color:var(--muted);margin-bottom:2px}
/* Báo cáo sản xuất: màn hình rộng thì mỗi sản phẩm một dòng; iPad dọc 2 hàng; điện thoại xếp dọc */
main.wrap:has(> #tab-daily:not([hidden])){max-width:1240px}
.ltable{container-type:inline-size}
@container (max-width:900px){
  .lrow.lhead{display:none}
  .ml{display:block}
  .lrow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);row-gap:10px}
  .lact{justify-content:flex-end;align-self:end}
}
@container (max-width:560px){
  .lrow{grid-template-columns:1fr 1fr}
  .lc.lp{grid-column:1/-1}
  .lact{grid-column:1/-1;justify-content:flex-start}
}

.pblock h3{margin:0 0 6px;font-size:14px}
.panel.danger{border-color:var(--ng)}
.panel.danger h2{color:var(--ng)}
.pick{display:flex;gap:8px;align-items:center;padding:4px 0}
.brand h1{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.brand .jp{font-family:var(--jp);font-size:12px;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-height:6px}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--wait-soft);color:var(--wait);font-size:12px;font-family:var(--mono)}

.wrap{padding-block:18px 48px}
.wrap section{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.narrow{max-width:420px;width:100%;margin-inline:auto}
.panel h2{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}
.notice{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px}
.alert{background:var(--ng-soft);color:var(--ng);border-radius:8px;padding:12px 14px;font-weight:600}
.alert .jp{font-family:var(--jp);font-weight:400;font-size:13px;display:block}

.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;min-width:0}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot b{font-size:14px}
.slot span{font-size:12px;color:var(--muted)}

.items{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .lbl{min-width:0;flex:1}
.item .lbl b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.item .lbl span{font-family:var(--jp);font-size:12px;color:var(--muted)}
.item.pv{flex-wrap:wrap}
.item.pv .lbl{flex:1 1 100%}
.item.pv .std{display:block;font-family:var(--font);color:var(--accent);font-weight:600;font-size:12.5px}
.vals{display:flex;gap:6px;flex:1 1 120px;min-width:0}
.vals .num{min-width:0;height:46px;font-family:var(--mono);font-size:18px !important;text-align:center}
.rng{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.rng input{text-align:center;font-family:var(--mono)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.item .std{display:block;font-family:var(--font);color:var(--accent);font-weight:600;font-size:12.5px}
.stepv{display:flex;gap:6px;align-items:center;flex:none}
.stepv input[type=time]{width:132px;font-family:var(--mono)}
.item.st{flex-wrap:wrap}
.item.st .lbl{flex:1 1 100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip,.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.pchip[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border-radius:8px;font-weight:500;font-size:14px}
.insp{display:flex;flex-direction:column;gap:2px;font-weight:400;color:var(--ink);font-size:14px}
.insp label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.insp label:first-child{border-top:0}
.insp input{width:22px;height:22px;flex:none;margin-top:1px}
.insp small{display:block;font-family:var(--jp);color:var(--muted);font-size:12px}
.qty{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--ink)}
.qty input[type=text]{width:84px;text-align:center;font-family:var(--mono)}
.li.today{border-color:var(--accent)}
.stps{display:flex;flex-direction:column;gap:8px}
.stp{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.stp .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:700;font-size:16px}
.stp .stl{display:flex;flex-direction:column;min-width:0;flex:1}
.stp .stl b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .stl small{color:var(--muted);font-size:12px}
.stp .t{flex:none;font-size:13px;font-weight:600;color:var(--accent)}
.stp.done{background:var(--ok-soft);border-color:var(--ok);cursor:default;opacity:1}
.stp.done .box{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.stp.done .t{color:var(--ok);font-size:16px}
.stp:disabled:not(.done){opacity:.6;cursor:default}
.remind{border:1.5px solid var(--wait);background:var(--wait-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.remind summary{font-weight:700;color:var(--wait);cursor:pointer}
.remind ul{margin:10px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.remind p{margin:6px 0 0}
.qrow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.qrow>span{flex:1 1 100%;font-weight:600;font-size:14px}
.who{display:flex;gap:6px 8px;flex-wrap:wrap;font-size:12.5px;flex:1 1 100%}
.who span{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.who span.miss{border-color:var(--ng);color:var(--ng);background:var(--ng-soft)}
.edited{background:var(--wait-soft);color:var(--wait);border-radius:6px;padding:6px 10px;font-size:13.5px;font-weight:600}
.srow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srow .sinfo{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.srow .sinfo b{font-size:14px} .srow .sinfo .sub,.srow .sstat .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sstat{flex:1 1 0;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .btn{flex:none}
.okng{display:flex;gap:6px;flex:none}
.okng button{width:58px;height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer}
.okng button[data-v="OK"][aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.okng button[data-v="NG"][aria-pressed="true"]{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.okng button:disabled{cursor:default;opacity:.75}

label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=month],input[type=time],select,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:400;color:var(--ink)}
input[type=file]{font-size:13px;max-width:100%}
textarea{min-height:70px;resize:vertical}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--ng);border-color:var(--ng)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;font-size:15px;color:var(--ng);border:2px dashed var(--ng);background:var(--ng-soft)}
.btn.cam.done{color:var(--ink);border:1.5px solid var(--line);background:var(--surface);min-height:46px}
.btn.cam svg{flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.vh:focus-visible + #photoPrev, .btn.cam:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.ng{border-color:var(--ng)}
.card .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.marks{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.mark{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.mark.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);font-weight:600}
.photo{max-width:min(100%,420px);border-radius:8px;border:1px solid var(--line);display:block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-family:var(--mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--muted)}
.tile{min-width:0}
.tile.wide{grid-column:span 2}
.pareto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 28px}
.pblock h3{margin:0 0 6px;font-size:14px}
.prow{display:grid;grid-template-columns:1fr 94px 46px 58px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.prow.phead{border-top:0;padding:0;font-size:11.5px;color:var(--muted);white-space:nowrap}
.prow.phead span,.prow .pc,.prow .ps{text-align:right}
.prow .pbar,.prow .pbar0{grid-column:1/-1;grid-row:2}
.prow .pbar0{display:none}
.prow .ps{font-size:13px}
@media(min-width:760px){.prow{grid-template-columns:minmax(90px,28%) 1fr 94px 46px 58px}.prow .pbar,.prow .pbar0{grid-column:auto;grid-row:auto;display:block}}
.prow .pl{min-width:0;overflow-wrap:anywhere}
.prow .pl small{display:block;color:var(--muted);font-size:11.5px}
.prow .pl .orig{display:block}
.prow .pbar{height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.prow .pbar i{display:block;height:100%;background:var(--muted);opacity:.45;border-radius:3px}
.prow.vital .pbar i{background:var(--accent);opacity:1}
.prow .pv{white-space:nowrap;text-align:right;font-size:13px}
.prow .pc{color:var(--muted);font-size:12.5px}
.prow.vital .pc{color:var(--ink);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.sun td{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.li>div{min-width:0;overflow-wrap:anywhere}
.li.off{opacity:.6}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.day.off{opacity:.55}
.day.today{border-color:var(--accent)}
.dayh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.offt{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;padding:4px 10px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer}
.offt input{width:18px;height:18px;font-size:16px}
.dayg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.dayg .f{min-width:0}
.lab{display:flex;gap:6px;justify-content:space-between;align-items:baseline;min-width:0}
.lab span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lab .mono{flex:none;font-weight:400;font-size:12px}
select.asg{padding-inline:8px;text-overflow:ellipsis;height:44px;padding-block:0}
@media (min-width:640px){ .dayg{grid-template-columns:repeat(3,minmax(0,1fr))} }
select.asg{color:var(--muted)}

const TYPES = {checks:"check", approvals:"appr", accounts:"acc", photos:"photo", config:"config", tr:"tr", assign:"assign", off:"off", daily:"daily", steps:"steps", dappr:"dappr"};
function makeDb(){
  const col = firebase.firestore().collection(COLLECTION);
  const wrap = (d, p) => ({id:d.id.slice(p.length), exists:d.exists, data:() => d.data()});
  return {
    doc(path){ const i = path.indexOf("/"), c = path.slice(0,i), p = TYPES[c]+"_", ref = col.doc(p+path.slice(i+1));
      return { set:d => ref.set(Object.assign({type:TYPES[c]}, d)), delete:() => ref.delete(), get:() => ref.get().then(s => wrap(s,p)),
               onSnapshot:(n,e) => ref.onSnapshot(s => n(wrap(s,p)), e) }; },
    /* "assign" lọc theo ngày (adate) nên không kèm điều kiện type, tránh phải tạo composite index */
    collection(c){ const p = TYPES[c]+"_"; let q = c==="assign" ? col : col.where("type","==",TYPES[c]);
      const docs = sn => sn.docs.filter(d => d.id.indexOf(p)===0).map(d => wrap(d,p));
      const api = { where(f,op,v){ q = q.where(f,op,v); return api; }, limit(n){ q = q.limit(n); return api; },
        get:() => q.get().then(sn => ({docs:docs(sn)})),
        onSnapshot:(n,e) => q.onSnapshot(sn => n({docs:docs(sn)}), e) };
      return api; }
  };

/* ---------- language ---------- */
function T(s, v){ let o = S.lang==="ja" && JA[s] ? JA[s] : s; if(v) for(const k in v) o = o.split("{"+k+"}").join(v[k]); return o; }
const shiftL = s => T(s==="S" ? "Sáng" : "Chiều");
const roleL = r => T(ROLE_LABEL[r]);
const dowOf = s => { const p = s.split("-").map(Number); return DOW[S.lang][new Date(p[0],p[1]-1,p[2]).getDay()]; };
const mName = n => n;
const meName = () => S.me.id==="owner" ? T("Chủ trang") : S.me.name;
const isJa = s => /[぀-ヿ一-鿿]/.test(s);
const needTr = s => (S.lang==="ja") !== isJa(s);
function trKey(s){ let a = 0x811c9dc5, b = 5381; for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); a = Math.imul(a^c, 16777619); b = (Math.imul(b,33)+c)|0; } return (a>>>0).toString(16)+"-"+(b>>>0).toString(16)+"-"+s.length; }
function trPlain(s){ if(!s || !needTr(s)) return s||""; return S.tr.get(trKey(s)) || s; }
function txt(s){
  if(!s) return ""; if(!needTr(s)) return esc(s);
  const k = trKey(s), o = S.tr.get(k);
  if(o) return esc(o)+'<span class="orig">'+esc(s)+'</span>';
  if(S.sample && !S.trTried.has(k)){ S.trQueue.add(s); clearTimeout(txt.h); txt.h = setTimeout(runTr, 700); return esc(s)+' <span class="sub">'+T("(đang dịch…)")+'</span>'; }
  return esc(s);
}
async function translateBatch(texts, target){
  const r = await fetch("https://translation.googleapis.com/language/translate/v2?key="+encodeURIComponent(TRANSLATE_API_KEY), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:texts, target:target, format:"text"})});
  if(!r.ok) throw new Error("translate "+r.status);
  return (await r.json()).data.translations.map(t => t.translatedText);
}
async function runTr(){
  if(S.trBusy || !S.trQueue.size || !S.sample) return;
  S.trBusy = true;
  const items = [...S.trQueue].slice(0,20); items.forEach(s => { S.trQueue.delete(s); S.trTried.add(trKey(s)); });
  try{
    for(const target of ["ja","vi"]){
      const part = items.filter(s => isJa(s) ? target==="vi" : target==="ja"); if(!part.length) continue;
      const out = await translateBatch(part, target);
      for(let i=0;i<part.length;i++){ const o = String(out[i]||"").trim(); if(!o) continue; const k = trKey(part[i]); S.tr.set(k, o);
        try{ await S.db.doc("tr/"+k).set({src:part[i], out:o}); }catch(e){} }
    }
  }catch(e){ S.sample = null; }
  S.trBusy = false; refresh();
  if(S.trQueue.size) setTimeout(runTr, 700);
}

function resultChip(c){ return '<span class="chip '+(isPass(c)?"ok":"ng")+'">'+resultText(c)+'</span>'; }
function timingText(c){ return c.timing==="late" ? T("Trễ {n} phút",{n:c.lateMin}) : c.timing==="early" ? T("Kiểm quá sớm") : T("Đúng giờ"); }
function timingChip(c){ return '<span class="chip '+(c.timing==="late"?"ng":c.timing==="early"?"wait":"ok")+'">'+timingText(c)+'</span>'; }
function timingAt(shift, d){ const t = S.cfg.times[shift], m = d.getHours()*60+d.getMinutes();

function photoBlock(id, c){ const one = (pid, alt, label) => S.photos.has(pid) ? '<img class="photo" alt="'+T(alt)+'" src="'+S.photos.get(pid)+'">' : '<div><button class="btn sm" data-photo="'+esc(pid)+'">'+T(label)+'</button></div>';

async function fetchPhoto(id){ if(S.photos.has(id)) return true; try{ const s = await S.db.doc("photos/"+id).get(); if(s.exists){ S.photos.set(id, s.data().data); return true; } }catch(e){} toast(T("Chưa tải được ảnh.")); return false; }

async function hashPw(salt, pw){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,"0")).join("");

const OWNER = () => ({id:"owner", name:"Chủ trang", role:"admin", machines:[], shifts:["S","C"]});
async function doLogin(){

  if(!a || !a.active || (await hashPw(a.salt, pw))!==a.hash) return toast(T("Sai ID hoặc mật khẩu, hoặc tài khoản đã bị khoá."));
  S.me = Object.assign({id:id}, a); lsSet("pvc_session", id); S.form.dirty = S.dform.dirty = S.sform.dirty = false; S.dform.key = ""; S.op = null; S.opPick = null;

async function firstAdmin(){
  if(S.busy) return;
  const id = $("#faId").value.trim().toLowerCase(), name = $("#faName").value.trim(), pw = $("#faPw").value;
  if(!/^[a-z0-9._-]{3,20}$/.test(id)) return toast(T("ID gồm 3–20 ký tự: chữ thường không dấu, số, dấu . _ -"));
  if(S.accounts.has(id)) return toast(T("ID này đã có. Chọn ID khác."));
  if(!name) return toast(T("Hãy nhập họ tên."));
  if(pw.length<4) return toast(T("Mật khẩu cần ít nhất 4 ký tự."));
  S.busy = true;
  try{ const salt = newSalt(), doc = {name:name, role:"admin", active:true, machines:[], shifts:["S","C"], salt:salt, hash:await hashPw(salt,pw), createdBy:id, createdByName:name, updatedAt:new Date().toISOString()};
    await S.db.doc("accounts/"+id).set(doc); S.accounts.set(id, doc); S.me = Object.assign({id:id}, doc); lsSet("pvc_session", id); S.tab = "accounts";
    if(document.activeElement) document.activeElement.blur(); render(); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được tài khoản. Thử lại.")); }
  S.busy = false;
}
function syncSession(){
  if(S.me && S.me.id!=="owner"){ const a = S.accounts.get(S.me.id); if(!a || !a.active || a.role==="worker"){ S.me=null; lsSet("pvc_session",null); toast(T("Tài khoản đã bị khoá hoặc xoá.")); } else S.me = Object.assign({id:S.me.id}, a); }
  if(!S.me){ const sid = lsGet("pvc_session");
    if(sid==="owner" && S.isOwner) S.me = OWNER();
    else if(sid && S.accounts.has(sid) && S.accounts.get(sid).active && S.accounts.get(sid).role!=="worker") S.me = Object.assign({id:sid}, S.accounts.get(sid)); }
  if(S.op){ const o = S.accounts.get(S.op.id); if(!o || !o.active || !S.me || S.me.role!=="device") S.op = null; }
}

const STAGE_LABEL = {S:"Kiểm máy sáng", C:"Kiểm máy chiều", R:"Báo cáo cuối ngày"};
function stageName(c){ const st = STAGES.find(x => x.c===c); if(st.step){ const i = STEPS.find(x => x.k===st.step); return S.lang==="ja" ? i.jp : i.vi; } return T(STAGE_LABEL[c]); }
function stageShort(c){ const st = STAGES.find(x => x.c===c); if(st.step){ const i = STEPS.find(x => x.k===st.step); return S.lang==="ja" ? i.sj : i.short; } return T(STAGE_LABEL[c]); }
const isDevice = () => !!S.me && S.me.role==="device";

const pinOf = a => a.pin || DEFAULT_PIN;
const actor = () => isDevice() ? S.op : S.me;
function myStages(date, mid){ const out = new Set(); if(isDevice()){ if(mid===S.me.machineId) STAGES.forEach(st => out.add(st.c)); return out; } STAGES.forEach(st => { const as = S.assign.get(date+"_"+st.c+"_"+mid); if(as && as.workerId===S.me.id) out.add(st.c); }); return out; }

function loadForm(){
  const c = S.checks.get(slotId());

  S.form.nums = {temp:c ? (c.tempVal||"") : "", temp2:c ? (c.temp2Val||"") : "", speed:c ? (c.speedVal||"") : ""};

const curMachine = () => S.cfg.machines.find(x => x.id===S.slot.machine) || {};
const numOf = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const has = v => v!==null && v!==undefined && v!=="";
function rangeText(lo, hi){ return has(lo) && has(hi) ? lo+" – "+hi : has(lo) ? "≥ "+lo : has(hi) ? "≤ "+hi : ""; }
function limitsOf(mc, k){ return k==="temp" ? [["temp", mc.tMin, mc.tMax]].concat(mc.two ? [["temp2", mc.t2Min, mc.t2Max]] : []) : [["speed", mc.sMin, mc.sMax]]; }
/* Nếu máy có đặt khoảng chuẩn: tự đánh giá OK/× theo số đã nhập. Trả null khi chưa đủ dữ liệu để đánh giá. */
function judge(mc, k){ let any = false, bad = false;
  for(const [f, lo, hi] of limitsOf(mc, k)){ if(!has(lo) && !has(hi)) continue; const v = S.form.nums[f]; if(!has(v)) return null; any = true;
    const n = numOf(v); if(n===null || (has(lo) && n<lo) || (has(hi) && n>hi)) bad = true; }
  return any ? (bad ? "NG" : "OK") : null; }
const prodList = () => S.form.product ? S.form.product.split(", ").filter(Boolean) : [];
const qtyText = n => { n = n||0; return [Math.floor(n/12) ? Math.floor(n/12)+" "+T("tá") : "", n%12 ? (n%12)+" "+T("đôi") : ""].filter(Boolean).join(" ") || "0"; };
const b2Text = d => qtyText(d.b2Total);
const stepsKey = () => S.today+"_"+S.slot.machine;
function mySchedule(){ const out = [];
  for(let i=0;i<7;i++){ const date = addDays(mondayOf(S.today), i); if(date<S.today || isOff(date)) continue; const items = [];
    S.cfg.machines.forEach(m => { const st = myStages(date, m.id); if(st.size) items.push((multi() ? mName(m.name)+": " : "")+STAGES.filter(x => st.has(x.c)).map(x => stageShort(x.c)).join(", ")); });
    if(items.length) out.push([date, items]); }
  return out; }
function scheduleHtml(){ if(isDevice()) return ''; const sc = mySchedule();
  return '<div class="panel"><h2>'+T("Lịch phân công của tôi tuần này")+'</h2>'+(sc.length ? '<div class="list">'+sc.map(([d,it]) => '<div class="li'+(d===S.today?" today":"")+'"><div><b>'+dowOf(d)+'</b> <span class="mono">'+fmtDate(d).slice(0,5)+'</span></div><div class="sub" style="flex:1 1 100%">'+it.map(esc).join("<br>")+'</div></div>').join("")+'</div>' : '<div class="notice">'+T("Tuần này bạn chưa được phân công việc nào.")+'</div>')+'</div>'; }

function noteLabel(anyNG){ return T(anyNG ? "Ghi chú (bắt buộc khi có ×)" : "Ghi chú"); }
const curSteps = () => S.steps.get(stepsKey()) || {};

function procLocked(){ const id = S.today+"_S_"+S.slot.machine, c = S.checks.get(id); return !!c && stateOf(c, S.apprs.get(id))!=="returned"; }

      +'<span class="t">'+(done ? '<span class="mono">'+esc(done)+'</span>' : T("Bấm khi xong"))+'</span></button>'; }).join(""); }
async function markStep(k){
  if(S.busy || !actor() || dayChanged()) return;
  const key = stepsKey(), cur = Object.assign({}, S.steps.get(key)); if(cur[k]) return;
  const d = new Date(), t = pad(d.getHours())+":"+pad(d.getMinutes()), m = curMachine();
  Object.assign(cur, {date:S.today, month:S.today.slice(0,7), machineId:m.id, machineName:m.name}); cur[k] = t; cur[k+"By"] = actor().name;
  S.busy = true;
  try{ await S.db.doc("steps/"+key).set(cur); S.steps.set(key, cur); toast(T("Đã ghi giờ {t}.",{t:t})); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được. Kiểm tra mạng rồi bấm lưu lại.")); }
  S.busy = false; paintSteps();
}

function renderCheck(){

async function opConfirm(){
  const a = S.opPick && S.accounts.get(S.opPick), el = $("#opPin"); if(!a || !el || S.busy) return;
  if(Date.now()<S.opLock) return toast(T("Nhập sai nhiều lần. Chờ 1 phút rồi thử lại."));
  const pin = el.value.trim(); if(!/^\d{4}$/.test(pin)) return toast(T("Mã PIN gồm đúng 4 chữ số."));
  const ok = pin===pinOf(a);
  if(!ok){ S.opFail++; el.value = ""; if(S.opFail>=5){ S.opFail = 0; S.opLock = Date.now()+60000; } return toast(T("Sai mã PIN.")); }
  S.opFail = 0; S.op = {id:S.opPick, name:a.name}; S.opPick = null; S.opAt = Date.now(); S.form.dirty = S.sform.dirty = false; if(document.activeElement) document.activeElement.blur(); render();
}
async function savePin(){
  const a = S.op && S.accounts.get(S.op.id), p1 = ($("#np1")||{}).value||"", p2 = ($("#np2")||{}).value||""; if(!a || S.busy) return;
  if(!/^\d{4}$/.test(p1)) return toast(T("Mã PIN gồm đúng 4 chữ số."));
  if(p1!==p2) return toast(T("Hai lần nhập mã PIN không khớp."));
  if(p1===pinOf(a)) return toast(T("Mã PIN mới trùng mã cũ."));
  S.busy = true;
  try{ await S.db.doc("accounts/"+S.op.id).set(Object.assign({}, a, {pin:p1, pinChangedAt:new Date().toISOString(), updatedAt:new Date().toISOString()})); S.pinEdit = false; if(document.activeElement) document.activeElement.blur(); toast(T("Đã đổi mã PIN.")); }
  catch(err){ toast(T("Chưa lưu được. Kiểm tra mạng rồi bấm lưu lại.")); }

}

/* ---------- tab Báo cáo sản xuất: tổ trưởng nhập từng mã hàng, cập nhật nhiều lần trong ngày, chốt trước 20:00 ---------- */
const DAILY_DUE = "20:00", DAILY_DUE_MIN = 20*60;
function dTiming(d){ const t = new Date(d.at), m = t.getHours()*60+t.getMinutes()-DAILY_DUE_MIN; return m>0 ? {timing:"late", lateMin:m} : {timing:"ontime", lateMin:0}; }
/* Báo cáo kiểu cũ (một số loại 2 cho cả ngày) được đọc như một dòng duy nhất */
function dLines(d){ if(!d) return []; if(Array.isArray(d.lines)) return d.lines; return [{id:"old", product:d.product||"", qty:null, b2:d.b2Total||0, causes:Array.isArray(d.causes) ? d.causes : [], note:d.other||"", at:d.at, by:d.reporter||""}]; }
const lineCauses = l => (l.causes||[]).concat(l.note ? [l.note] : []);
const rateText = (q, b) => q>0 ? (Math.round(b/q*1000)/10).toString().replace(".", S.lang==="ja" ? "." : ",")+"%" : "—";
function allLines(list){ const out = []; list.forEach(d => dLines(d).forEach(l => out.push({d:d, l:l}))); return out; }
function dailyMachines(){ return !S.me || S.me.role!=="leader" || isOff(S.today) ? [] : S.cfg.machines; }
function dailyMissing(){ return dailyMachines().filter(m => !dLines(S.daily.get(S.today+"_"+m.id)).length).length; }
const splitQty = n => n ? [Math.floor(n/12) ? String(Math.floor(n/12)) : "", n%12 ? String(n%12) : ""] : ["",""];
const newLine = () => ({id:"l"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36), product:"", qta:"", qdoi:"", bta:"", bdoi:"", causes:[], note:"", saved:false, dirty:false});
function loadDaily(){ const key = S.today+"_"+S.dmachine, ls = dLines(S.daily.get(key)).map(l => { const q = splitQty(l.qty), b = splitQty(l.b2); return {id:l.id, product:l.product||"", qta:q[0], qdoi:q[1], bta:b[0], bdoi:b[1], causes:(l.causes||[]).slice(), note:l.note||"", saved:true, dirty:false, at:l.at, by:l.by}; });
  S.dform = {key:key, lines:ls.length ? ls : [newLine()], dirty:false}; }
function renderDaily(){
  const box = $("#tab-daily"), ms = dailyMachines();
  if(isOff(S.today)){ box.innerHTML = '<div class="panel"><h2>'+dowOf(S.today)+', <span class="mono">'+fmtDate(S.today)+'</span></h2><div class="notice">'+T("Hôm nay là ngày nghỉ. Không cần báo cáo.")+'</div></div>'; return; }
  if(!ms.length){ box.innerHTML = ''; return; }
  if(!ms.some(m => m.id===S.dmachine)){ S.dmachine = (ms.find(m => !dLines(S.daily.get(S.today+"_"+m.id)).length) || ms[0]).id; S.dform.dirty = false; }
  if(S.dform.key!==S.today+"_"+S.dmachine || !S.dform.lines || !S.dform.dirty) loadDaily();

function compressImage(file){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { let side = 1100, q = 0.72, out = "";
        for(let i=0;i<6;i++){ const k = Math.min(1, side/Math.max(img.width,img.height)), cv = document.createElement("canvas");
          cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          out = cv.toDataURL("image/jpeg", q); if(out.length < 220000) break; side = Math.round(side*0.8); q -= 0.08; }
        out.length < 240000 ? res(out) : rej(new Error("big")); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}

async function leaderStep(){
  if(S.busy || dayChanged()) return;
  const a = S.stepAct, reason = a.reason.trim(); if(!reason) return toast(T("Hãy ghi lý do."));
  const p = a.id.split("|"), mid = p[0], k = p[1], key = S.today+"_"+mid, cur = Object.assign({}, S.steps.get(key)), m = S.cfg.machines.find(x => x.id===mid), now = new Date(), t = pad(now.getHours())+":"+pad(now.getMinutes());
  const log = (cur.log||[]).slice();
  if(a.act==="proxy"){ if(cur[k]){ S.stepAct = null; return renderApprove(); }
    cur[k] = t; cur[k+"By"] = S.me.name+" (thay)"; log.push({k:k, act:"proxy", by:S.me.name, at:now.toISOString(), time:t, reason:reason}); }
  else { log.push({k:k, act:"cancel", by:S.me.name, at:now.toISOString(), reason:reason, prev:cur[k]||"", prevBy:cur[k+"By"]||""});
    delete cur[k]; delete cur[k+"By"];
    if(k==="sample"){ delete cur.sampleQ; delete cur.gloss; delete cur.sampleNote; cur.hasSample = false; } }
  Object.assign(cur, {date:S.today, month:S.today.slice(0,7), machineId:m.id, machineName:m.name, log:log.slice(-20)});
  S.busy = true;
  try{ await S.db.doc("steps/"+key).set(cur); S.steps.set(key, cur); S.stepAct = null; if(document.activeElement) document.activeElement.blur(); toast(T(a.act==="proxy" ? "Đã bấm thay lúc {t}." : "Đã huỷ bước này.",{t:t})); }
  catch(err){ toast(T("Chưa lưu được. Thử lại.")); }
  S.busy = false; renderApprove();
}

async function writeAppr(id, status, note, action){
  const c = S.checks.get(id); if(!c) return;
  const ap = {date:c.date, month:c.month, status:status, checkAt:c.at, approverId:S.me.id, approver:S.me.name, by:S.uid, at:new Date().toISOString(), note:note||"", action:action||""};
  await S.db.doc("approvals/"+id).set(ap); sheetSend([sheetApprRow(id, ap, c)]);
}
$("#tab-approve").addEventListener("input", e => { if(e.target.dataset.sreason && S.stepAct) S.stepAct.reason = e.target.value; if(e.target.dataset.ret) S.returnNote = e.target.value; if(e.target.dataset.action) S.actions[e.target.dataset.action] = e.target.value; });
$("#tab-approve").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.photo){ b.disabled = true; await fetchPhoto(b.dataset.photo); return renderApprove(); }
  if(S.me.role!=="leader") return;
  if(b.dataset.sact){ S.stepAct = {id:b.dataset.sid, act:b.dataset.sact, reason:""}; return renderApprove(); }
  if(b.dataset.sno){ S.stepAct = null; return renderApprove(); }
  if(b.dataset.sgo) return leaderStep();
  if(b.dataset.dok){ const k = b.dataset.dok, d = S.daily.get(k); if(!d) return; S.busy = true; b.disabled = true;
    try{ await S.db.doc("dappr/"+k).set({date:d.date, month:d.month, status:"approved", dailyAt:d.at, total:d.b2Total||0, approverId:S.me.id, approver:S.me.name, at:new Date().toISOString()}); toast(T("Đã duyệt.")); }
    catch(err){ toast(T("Chưa lưu được. Thử lại.")); }
    S.busy = false; return renderApprove(); }
  const act = b.dataset.act, id = b.dataset.id;
  if(act==="ret"){ S.returning = id; S.returnNote = ""; return renderApprove(); }
  if(act==="retCancel"){ S.returning = null; return renderApprove(); }
  if(act==="ok"){ const c = S.checks.get(id); if(c && !isPass(c) && !(S.actions[id]||"").trim()) return toast(T("Phiếu có lỗi: hãy ghi biện pháp đã thực hiện trước khi duyệt.")); }
  if(act==="retSend" && !S.returnNote.trim()) return toast(T("Hãy ghi lý do trả lại."));
  S.busy = true; b.disabled = true;
  try{
    if(act==="ok"){ await writeAppr(id,"approved","",(S.actions[id]||"").trim()); delete S.actions[id]; toast(T("Đã duyệt.")); }
    else if(act==="retSend"){ await writeAppr(id,"returned",S.returnNote.trim(),""); S.returning=null; toast(T("Đã trả lại cho công nhân.")); }
    else if(b.id==="approveAll"){ const ids = pendingList().filter(([,c]) => isPass(c)).map(([i]) => i); for(const i of ids) await writeAppr(i,"approved","",""); toast(T("Đã duyệt {n} phiếu.",{n:ids.length})); }
  }catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được. Thử lại.")); }
  S.busy = false; renderApprove();
});

  if(S.editAcc==="__new") h += accForm("__new");

      +'<div class="sub">'+[a.role==="device" ? T("Máy:")+" "+esc(mName((S.cfg.machines.find(m => m.id===a.machineId)||{}).name||T("chưa chọn"))) : a.role==="worker" ? (admin ? T("Mã PIN:")+' <b class="mono">'+esc(pinOf(a))+'</b>'+(a.pin ? '' : ' ('+T("mặc định")+')') : T("Dùng mã PIN 4 số")) : "", by].filter(Boolean).join(" · ")+'</div></div>'

async function saveAcc(){
  const isNew = S.editAcc==="__new", admin = S.me.role==="admin";
  const id = isNew ? $("#accId").value.trim().toLowerCase() : S.editAcc, prev = S.accounts.get(id);
  const name = $("#accName").value.trim(), pw = $("#accPw").value;
  if(isNew && !/^[a-z0-9._-]{3,20}$/.test(id)) return toast(T("ID gồm 3–20 ký tự: chữ thường không dấu, số, dấu . _ -"));
  if(isNew && (prev || id==="owner")) return toast(T("ID này đã có. Chọn ID khác."));
  if(!name) return toast(T("Hãy nhập họ tên."));
  const role = admin ? $("#accRole").value : "worker";
  if(role==="worker"){ if(pw && !/^\d{4}$/.test(pw)) return toast(T("Mã PIN của công nhân gồm đúng 4 chữ số.")); }
  else if((isNew || pw || (prev && prev.role==="worker")) && pw.length<4) return toast(T("Mật khẩu cần ít nhất 4 ký tự."));
  const machineId = role==="device" ? $("#accMachine").value : "";
  if(role==="device" && !machineId) return toast(T("Hãy chọn máy cho tài khoản iPad."));
  if(!admin && prev && prev.role!=="worker") return toast(T("Tổ trưởng chỉ sửa được tài khoản công nhân."));
  const shifts = ["S","C"], machines = [];
  const doc = {name:name, role:role, active:isNew ? true : $("#accActive").checked, machines:machines, shifts:shifts.length?shifts:["S","C"], machineId:machineId,
    salt:prev?prev.salt:"", hash:prev?prev.hash:"", createdBy:prev?prev.createdBy:S.me.id, createdByName:prev?prev.createdByName:S.me.name, updatedAt:new Date().toISOString()};
  if(role==="worker") doc.pin = pw || (prev && prev.role==="worker" && prev.pin) || DEFAULT_PIN;
  S.busy = true;
  try{ if(role!=="worker" && (isNew || pw)){ doc.salt = newSalt(); doc.hash = await hashPw(doc.salt, pw); }
    await S.db.doc("accounts/"+id).set(doc); S.editAcc = null; toast(isNew ? T("Đã tạo tài khoản {id}.",{id:id}) : T("Đã lưu tài khoản.")); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được tài khoản. Thử lại.")); }
  S.busy = false; renderAccounts();
}
$("#tab-accounts").addEventListener("click", async e => {
  const b = e.target.closest("button[data-acc]"); if(!b || S.busy) return;
  const act = b.dataset.acc;
  if(act==="new"){ S.editAcc = "__new"; return renderAccounts(); }
  if(act==="edit"){ S.editAcc = b.dataset.id; return renderAccounts(); }
  if(act==="cancel"){ S.editAcc = null; return renderAccounts(); }

  if(act==="del"){ if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=T("Bấm lần nữa để xoá"); return; }
    S.busy = true; try{ await S.db.doc("accounts/"+b.dataset.id).delete(); toast(T("Đã xoá tài khoản.")); }catch(err){ toast(T("Chưa xoá được.")); } S.busy = false; }
});

/* ---------- assign tab (phân công theo tuần) ---------- */
function isSunday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===0; }
function isSaturday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===6; }
/* Ngày không cần kiểm: mọi Chủ nhật, và Thứ bảy nào được tổ trưởng đánh dấu là ngày nghỉ */
function isOff(s){ return isSunday(s) || S.off.has(s); }
function addDays(s, n){ const p = s.split("-").map(Number); return ymd(new Date(p[0], p[1]-1, p[2]+n)); }
function mondayOf(s){ const p = s.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]); return addDays(s, -((d.getDay()+6)%7)); }
function workerList(){ return [...S.accounts.entries()].filter(([,a]) => a.role==="worker" && a.active).sort((x,y) => x[1].name.localeCompare(y[1].name)); }
function defaultFor(a, sh, mid){ return (!a.machines || !a.machines.length || a.machines.includes(mid)) && (!a.shifts || a.shifts.includes(sh)); }
function renderAssign(){
  const box = $("#tab-assign"), ws = workerList(), days = [0,1,2,3,4,5].map(i => addDays(S.week, i)), ms = S.cfg.machines;
  if(!ms.some(m => m.id===S.asgMachine)) S.asgMachine = ms[0].id;
  const mid = S.asgMachine;
  let h = '<div class="panel"><div class="row between"><h2>'+T("Phân công theo tuần")+'</h2><div class="row"><button class="btn sm" data-wk="-7" aria-label="'+T("Tuần trước")+'">◀</button><span class="mono">'+fmtDate(days[0]).slice(0,5)+' – '+fmtDate(days[5])+'</span><button class="btn sm" data-wk="7" aria-label="'+T("Tuần sau")+'">▶</button></div></div>'
    +'<div class="sub">'+T("Chọn người cho từng công đoạn. Ô chưa chọn thì chưa có ai phụ trách.")+'</div>';
  if(!ws.length){ box.innerHTML = h+'<div class="notice">'+T("Chưa có tài khoản công nhân nào. Tạo ở tab Tài khoản trước.")+'</div></div>'; return; }
  const opts = sel => ws.map(([id,a]) => '<option value="'+esc(id)+'"'+(id===sel?" selected":"")+'>'+esc(a.name)+'</option>').join("");
  if(ms.length>1) h += '<div class="seg" id="asgMachines">'+ms.map(m => '<button type="button" data-am="'+esc(m.id)+'" aria-pressed="'+(m.id===mid)+'">'+esc(mName(m.name))+'</button>').join("")+'</div>';
  h += '<div class="card"><b>'+T("Điền nhanh cho máy đang chọn")+'</b><div class="row"><select id="qfWorker" class="grow" aria-label="'+T("Chọn công nhân")+'"><option value=""'+(S.qfWorker?"":" selected")+'>'+T("Chọn công nhân")+'</option>'+opts(S.qfWorker)+'</select>'
    +'<select id="qfStage" class="grow" aria-label="'+T("Công đoạn")+'"><option value="">'+T("Tất cả công đoạn")+'</option>'+STAGES.map(x => '<option value="'+x.c+'"'+(x.c===S.qfStage?" selected":"")+'>'+esc(stageShort(x.c))+'</option>').join("")+'</select></div>'
    +'<div class="row"><button class="btn sm" data-qf="fill">'+T("Điền cả tuần")+'</button><button class="btn sm warn" data-qf="clear">'+T("Xoá phân công tuần này")+'</button></div></div>'
    +'<div class="row"><button class="btn" data-qf="copy">'+T("Sao chép phân công tuần trước (tất cả máy)")+'</button><span class="sub">'+T("Chỉ điền vào ô còn trống.")+'</span></div>';
  h += '<div class="list">';
  days.forEach(date => { const past = date<S.today, sat = isSaturday(date), off = S.off.has(date);
    h += '<div class="day'+(past?" off":"")+(date===S.today?" today":"")+'"><div class="dayh"><span><b>'+dowOf(date)+'</b> <span class="mono">'+fmtDate(date).slice(0,5)+'</span></span>'
      +(sat ? '<label class="offt"><input type="checkbox" data-off="'+date+'"'+(off?" checked":"")+(past?" disabled":"")+'>'+T("Ngày nghỉ")+'</label>' : '')+'</div><div class="dayg">';
    if(off) h += '<div class="notice" style="grid-column:1/-1">'+T("Ngày nghỉ – không cần kiểm máy.")+'</div>';
    else STAGES.forEach(x => { const key = date+"_"+x.c+"_"+mid, as = S.assign.get(key), sel = as ? as.workerId : "", stp = x.step ? STEPS.find(y => y.k===x.step) : null;
      h += '<label class="f"><span class="lab"><span>'+esc(stageShort(x.c))+'</span>'+(stp ? '<span class="mono">'+stp.at+'</span>' : '')+'</span><select class="asg'+(sel?" set":"")+'" data-as="'+esc(key)+'"'+(past?" disabled":"")+'>'
        +'<option value=""'+(sel?"":" selected")+'>'+T("Chọn")+'</option>'+opts(sel)
        +(sel && !ws.some(([id]) => id===sel) ? '<option value="'+esc(sel)+'" selected>'+esc(as.workerName||sel)+'</option>' : '')+'</select></label>'; });
    h += '</div></div>'; });
  box.innerHTML = h+'</div></div>';
}
async function setAssign(key, wid){
  if(!wid) return S.db.doc("assign/"+key).delete();
  const p = key.split("_");
  return S.db.doc("assign/"+key).set({adate:p[0], shift:p[1], machineId:p[2], workerId:wid, workerName:(S.accounts.get(wid)||{}).name||wid, by:S.me.id, at:new Date().toISOString()});
}
$("#tab-assign").addEventListener("change", async e => {
  const el = e.target;
  if(el.id==="qfWorker"){ S.qfWorker = el.value; return; }
  if(el.id==="qfStage"){ S.qfStage = el.value; return; }
  if(el.dataset.off){ el.blur(); const d = el.dataset.off;
    try{ if(el.checked) await S.db.doc("off/"+d).set({date:d, month:d.slice(0,7), by:S.me.id, at:new Date().toISOString()}); else await S.db.doc("off/"+d).delete(); toast(T("Đã lưu phân công.")); }
    catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
    return; }
  if(!el.dataset.as) return;
  el.blur();
  try{ await setAssign(el.dataset.as, el.value); toast(T("Đã lưu phân công.")); }catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
});
$("#tab-assign").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.wk){ S.week = addDays(S.week, +b.dataset.wk); return renderAssign(); }
  if(b.dataset.am){ S.asgMachine = b.dataset.am; return renderAssign(); }
  const qf = b.dataset.qf; if(!qf) return;
  if(qf==="clear" && b.dataset.sure!=="1"){ b.dataset.sure = "1"; b.textContent = T("Bấm lần nữa để xoá"); return; }
  if(qf==="copy"){ S.busy = true; let n = 0;
    try{ for(let i=0;i<6;i++){ const date = addDays(S.week, i); if(date<S.today || isOff(date)) continue;
        for(const m of S.cfg.machines) for(const st of STAGES){ const src = S.assign.get(addDays(date,-7)+"_"+st.c+"_"+m.id), k = date+"_"+st.c+"_"+m.id, acc = src && S.accounts.get(src.workerId);
          if(src && src.workerId && acc && acc.active && !S.assign.has(k)){ await setAssign(k, src.workerId); n++; } } }
      toast(n ? T("Đã sao chép {n} ô từ tuần trước.",{n:n}) : T("Không có ô nào để sao chép: tuần trước chưa phân công, hoặc tuần này đã đủ.")); }
    catch(err){ toast(T("Chưa lưu được phân công.")); }
    S.busy = false; return renderAssign(); }
  const wid = S.qfWorker || "", mid = S.asgMachine, codes = qf==="fill" && S.qfStage ? [S.qfStage] : STAGES.map(x => x.c);
  if(qf==="fill" && !wid) return toast(T("Hãy chọn công nhân trước."));
  S.busy = true; if(document.activeElement) document.activeElement.blur();
  try{
    for(let i=0;i<7;i++){ const date = addDays(S.week, i); if(date<S.today) continue;
      if(qf==="fill" && isOff(date)) continue;
      for(const c of codes){ const k = date+"_"+c+"_"+mid;
        if(qf==="clear"){ if(S.assign.has(k)) await setAssign(k, ""); } else await setAssign(k, wid); } }
    toast(T("Đã lưu phân công."));
  }catch(err){ toast(T("Chưa lưu được phân công.")); }
  S.busy = false; renderAssign();
});

/* ---------- report tab ---------- */
function loadReport(){
  if(!S.db) return;
  const r = S.report, ym = r.month;
  if(r.sub===ym) return;
  (r.unsubs||[]).forEach(u => { try{ u(); }catch(e){} });
  r.sub = ym; r.loaded = false; r.gotC = r.gotA = false; r.daily = [];
  const done = () => { if(r.sub!==ym) return; r.loaded = r.gotC && r.gotA; if(S.me && S.tab==="report") renderReport(); };
  const fail = () => { if(r.sub===ym){ r.sub = null; toast(T("Chưa tải được dữ liệu tháng. Thử lại.")); } };
  r.unsubs = [
    S.db.collection("checks").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.checks = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => x.id<y.id?-1:1); r.gotC = true; done(); }, fail),
    S.db.collection("approvals").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.apprs = new Map(q.docs.map(d => [d.id, d.data()])); r.gotA = true; done(); }, fail),
    S.db.collection("daily").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.daily = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => x.id<y.id?-1:1); done(); }, fail),
    S.db.collection("dappr").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.dapprs = new Map(q.docs.map(d => [d.id, d.data()])); done(); }, fail)
  ];
}
function paretoHtml(r){
  const cm = new Map(); allLines(r.daily).forEach(({l}) => { const cs = lineCauses(l); if(!cs.length || !(l.b2>0)) return; cs.forEach(x => { const o = cm.get(x) || {q:0, n:0}; o.q += l.b2/cs.length; o.n++; cm.set(x, o); }); });
  const im = new Map(); r.checks.forEach(c => itemsFor(c.shift).forEach(i => { if(c[i.k]==="NG"){ const k = (S.lang==="ja" ? i.sj : i.short) || i.vi; im.set(k, (im.get(k)||0)+1); } }));
  const block = (title, rows, val, extra, empty) => { const tot = rows.reduce((a,x) => a+x.v, 0), max = rows.length ? rows[0].v : 0; let cum = 0, vital = true;
    return '<div class="pblock"><h3>'+T(title)+'</h3>'+(rows.length ? '<div class="prow phead"><span></span><span class="pbar0"></span><span></span><span>'+T("Tỷ lệ")+'</span><span>'+T("Cộng dồn")+'</span></div>'+rows.map(x => { const dark = vital; cum += x.v; if(cum/tot>=0.8) vital = false;
        return '<div class="prow'+(dark?" vital":"")+'"><span class="pl">'+x.label+(extra ? '<small>'+extra(x)+'</small>' : '')+'</span><span class="pbar"><i style="width:'+Math.max(2, Math.round(x.v/max*100))+'%"></i></span><span class="pv mono">'+val(x)+'</span><span class="ps mono">'+Math.round(x.v/tot*100)+'%</span><span class="pc mono">'+Math.round(cum/tot*100)+'%</span></div>'; }).join("") : '<div class="notice">'+T(empty)+'</div>')+'</div>'; };
  const cr = [...cm.entries()].map(([k,o]) => ({label:txt(k), v:o.q, n:o.n})).sort((a,b) => b.v-a.v || b.n-a.n);
  const ir = [...im.entries()].map(([k,n]) => ({label:esc(k), v:n})).sort((a,b) => b.v-a.v);
  return '<div class="panel"><h2>'+T("Thống kê Pareto")+'</h2><div class="pareto">'
    + block("Nguyên nhân hàng loại 2", cr, x => qtyText(Math.round(x.v)), x => T("{n} dòng",{n:x.n}), "Tháng này chưa có hàng loại 2.")
    + block("Hạng mục kiểm không đạt", ir, x => T("{n} lần",{n:x.v}), null, "Tháng này không có lần kiểm nào không đạt.")
    + '</div><div class="sub">'+T("Tỷ lệ: phần của riêng dòng đó. Cộng dồn: cộng tỷ lệ từ dòng đầu xuống đến dòng đó (dòng cuối luôn là 100%).")+'<br>'+T("Màu đậm: nhóm chiếm 80% đầu. Một dòng sản phẩm có nhiều nguyên nhân thì số loại 2 của dòng đó được chia đều.")+'</div></div>';
}
/* Sản lượng và loại 2 theo sản phẩm, theo máy. Tỷ lệ chỉ tính trên các dòng có nhập sản lượng (báo cáo kiểu cũ không có). */
function prodTotals(list){ let q = 0, bq = 0; allLines(list).forEach(({l}) => { if(l.qty!==null && l.qty!==undefined){ q += l.qty||0; bq += l.b2||0; } }); return {q:q, bq:bq}; }
function groupLines(list, keyOf){ const m = new Map(); allLines(list).forEach(x => { const k = keyOf(x) || "—", o = m.get(k) || {q:0, b:0, bq:0, n:0}; o.n++; o.b += x.l.b2||0; if(x.l.qty!==null && x.l.qty!==undefined){ o.q += x.l.qty||0; o.bq += x.l.b2||0; } m.set(k, o); }); return [...m.entries()].sort((a,b) => b[1].q-a[1].q || b[1].b-a[1].b); }
function prodPanel(r){
  let h = '<div class="panel"><h2>'+T("Sản lượng và hàng loại 2")+'</h2>';
  if(!r.daily.length) return h+'<div class="notice">'+T("Tháng này chưa có báo cáo sản xuất nào.")+'</div></div>';
  const grp = (title, rows) => '<div class="pblock"><h3>'+T(title)+'</h3><div class="scroll"><table><tr><th>'+T(title==="Theo máy"?"Máy":"Tên sản phẩm")+'</th><th>'+T("Sản lượng")+'</th><th>'+T("Hàng loại 2")+'</th><th>'+T("Tỷ lệ loại 2")+'</th></tr>'+rows.map(([k,o]) => '<tr><td>'+esc(k)+'</td><td class="mono">'+qtyText(o.q)+'</td><td class="mono">'+qtyText(o.b)+'</td><td><b class="mono">'+rateText(o.q, o.bq)+'</b></td></tr>').join("")+'</table></div></div>';
  h += '<div class="pareto">'+grp("Theo sản phẩm", groupLines(r.daily, x => x.l.product))+grp("Theo máy", groupLines(r.daily, x => mName(x.d.machineName)))+'</div>';
  h += '<h3>'+T("Chi tiết theo ngày")+'</h3><div class="scroll"><table><tr><th>'+T("Ngày")+'</th><th>'+T("Máy")+'</th><th>'+T("Tên sản phẩm")+'</th><th>'+T("Sản lượng")+'</th><th>'+T("Hàng loại 2")+'</th><th>'+T("Tỷ lệ loại 2")+'</th><th>'+T("Nguyên nhân")+'</th><th>'+T("Ghi chú")+'</th><th>'+T("Người nhập")+'</th><th>'+T("Cập nhật")+'</th></tr>'

const vnQ = n => { n = n||0; return [Math.floor(n/12) ? Math.floor(n/12)+" tá" : "", n%12 ? (n%12)+" đôi" : ""].filter(Boolean).join(" ") || "0"; };
function sheetCheckRow(id, c){ const st = c.steps||{}, by = c.stepsBy||{}, step = k => st[k] ? st[k]+(by[k] ? " – "+by[k] : "") : "";
  return {sheet:"Phiếu kiểm", key:id, row:{"Ngày":vnD(c.date), "Ca":c.shift==="S" ? "Sáng" : "Chiều", "Máy":c.machineName||"", "Giờ kiểm":vnDT(c.firstAt||c.at), "Đúng giờ":c.timing==="late" ? "Trễ" : c.timing==="early" ? "Quá sớm" : "Đúng giờ", "Trễ (phút)":c.lateMin||0,
    "Nhiệt độ":c.tempVal||"", "Nhiệt độ 2":c.temp2Val||"", "KQ nhiệt độ":sym(c.temp), "Tốc độ":c.speedVal||"", "KQ tốc độ":sym(c.speed), "Mở máy":step("open"), "Vệ sinh":step("clean"), "Làm nóng khuôn":step("warm"), "Chạy mẫu":step("sample"),
    "Hạt PVC mẫu":sym(c.sample), "Độ bóng":sym(c.gloss), "Tên sản phẩm":c.product||"", "Kết quả":isPass(c) ? "Đạt" : "Không đạt", "Người kiểm":c.checker||"", "iPad":c.deviceId||"", "Ghi chú":[c.sampleNote, c.note].filter(Boolean).join(" · "), "Có ảnh":c.hasPhoto ? "Có" : "", "Cập nhật lúc":vnDT(c.at)}}; }
function sheetApprRow(id, a, c){ return {sheet:"Duyệt", key:id, row:{"Ngày":vnD(a.date), "Ca":c ? (c.shift==="S" ? "Sáng" : "Chiều") : "", "Máy":c ? c.machineName||"" : "", "Người kiểm":c ? c.checker||"" : "", "Trạng thái":a.status==="approved" ? "Đã duyệt" : a.status==="returned" ? "Trả lại" : a.status, "Người duyệt":a.approver||"", "Thời gian duyệt":vnDT(a.at), "Biện pháp":a.action||"", "Lý do trả lại":a.status==="returned" ? a.note||"" : ""}}; }
function sheetDailyRows(key, d){ return dLines(d).map(l => ({sheet:"Báo cáo sản xuất", key:key+"_"+l.id, row:{"Ngày":vnD(d.date), "Máy":d.machineName||"", "Tên sản phẩm":l.product||"", "Sản lượng (đôi)":l.qty===null || l.qty===undefined ? "" : l.qty, "Sản lượng":l.qty===null || l.qty===undefined ? "" : vnQ(l.qty), "Loại 2 (đôi)":l.b2||0, "Loại 2":vnQ(l.b2), "Tỷ lệ loại 2 (%)":l.qty>0 ? Math.round((l.b2||0)/l.qty*1000)/10 : "", "Nguyên nhân":(l.causes||[]).join("; "), "Ghi chú":l.note||"", "Người nhập":l.by||d.reporter||"", "Cập nhật lúc":vnDT(l.at||d.at), "Trạng thái":"Đang dùng"}})); }
function sheetQueue(){ try{ return JSON.parse(lsGet(SHEET_Q)||"[]"); }catch(e){ return []; } }
async function sheetPost(items){ await fetch(S.sheetUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({token:SHEET_TOKEN, items:items})}); }
/* Gửi không chặn thao tác của người dùng; mất mạng thì giữ lại trên máy và gửi lại sau */
async function sheetSend(items){ if(!items || !items.length || !S.sheetUrl) return; const q = sheetQueue().concat(items);
  lsSet(SHEET_Q, JSON.stringify(q.slice(-2000)));
  try{ for(let i=0; i<q.length; i+=200) await sheetPost(q.slice(i, i+200)); lsSet(SHEET_Q, null); }catch(e){} }
async function sheetFlush(){ const q = sheetQueue(); if(!S.sheetUrl || !q.length) return; try{ for(let i=0; i<q.length; i+=200) await sheetPost(q.slice(i, i+200)); lsSet(SHEET_Q, null); }catch(e){} }
/* ---------- dọn dữ liệu cũ (chỉ admin, cần mật khẩu xoá) ---------- */
const PURGE_PW = "112";
const PURGE_COLS = ["checks","approvals","daily","dappr","steps","off"];
/* Giữ lại tháng này và 2 tháng trước; "cũ hơn 3 tháng" là mọi tháng trước mốc này */
function purgeCutoff(){ const p = S.today.split("-").map(Number), d = new Date(p[0], p[1]-3, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
const ymText = ym => ym.slice(5)+"/"+ym.slice(0,4);
function purgePanel(){ const pg = S.purge || (S.purge = {mode:"old", plan:null, running:false}), cut = purgeCutoff(), keepTo = S.today.slice(0,7);
  const opt = (v, label) => '<label class="pick"><input type="radio" name="purgeMode" value="'+v+'"'+(pg.mode===v?" checked":"")+(pg.running?" disabled":"")+'> '+label+'</label>';
  return '<div class="panel danger"><h2>'+T("Dọn dữ liệu")+'</h2><div class="sub">'+T("Xoá dữ liệu cũ khi dữ liệu nhiều và app chạy nặng. Xoá xong không khôi phục được: hãy xuất Excel các tháng cần lưu trước khi xoá.")+'</div>'
    +'<div class="checks">'+opt("old", T("Xoá dữ liệu cũ hơn 3 tháng (giữ lại {a} – {b})",{a:ymText(cut), b:ymText(keepTo)}))+opt("all", T("Xoá toàn bộ lịch sử kiểm tra"))+'</div>'
    +'<div class="sub">'+T("Gồm phiếu kiểm, kết quả duyệt, ảnh, bước đầu ca, báo cáo sản xuất, ngày nghỉ. Không xoá tài khoản, danh sách sản phẩm, nguyên nhân lỗi và cài đặt máy.")+'</div>'
    +'<div class="row"><label class="f" for="purgePw">'+T("Mật khẩu xoá dữ liệu")+'<input type="password" id="purgePw" autocomplete="off" inputmode="numeric"'+(pg.running?" disabled":"")+'></label></div>'
    +(pg.plan ? '<div class="alert">'+T("Sẽ xoá {n} bản ghi: {d}.",{n:pg.plan.items.length, d:pg.plan.desc})+'</div>' : '')
    +'<div class="row">'+(pg.plan ? '<button class="btn warn" id="purgeRun"'+(pg.running?" disabled":"")+'>'+T("Xác nhận xoá")+'</button><button class="btn" id="purgeCancel"'+(pg.running?" disabled":"")+'>'+T("Huỷ")+'</button>' : '<button class="btn warn" id="purgeScan">'+T("Kiểm tra dữ liệu sẽ xoá")+'</button>')+'</div>'
    +'<div class="sub" id="purgeMsg"></div></div>'; }
function purgePwOk(){ const el = $("#purgePw"); if(!el || el.value!==PURGE_PW){ toast(T("Sai mật khẩu xoá dữ liệu.")); return false; } return true; }
async function purgeScan(){
  if(S.busy || !purgePwOk()) return;
  const all = S.purge.mode==="all", cut = purgeCutoff(), items = [], count = {}, pw = $("#purgePw").value;
  S.busy = true; $("#purgeMsg").textContent = T("Đang kiểm tra dữ liệu…");
  try{
    for(const c of PURGE_COLS){ const q = await S.db.collection(c).get(); const ids = q.docs.filter(d => all || ((d.data()||{}).month||"")<cut).map(d => d.id); count[c] = ids.length; ids.forEach(id => items.push([c, id]));
      if(c==="checks") ids.forEach(id => items.push(["photos", id]));
      if(c==="steps") ids.forEach(id => { const i = id.indexOf("_"); items.push(["photos", id.slice(0,i)+"_S_"+id.slice(i+1)+"s"]); }); }
    const qa = await S.db.collection("assign").where("adate", "<", all ? "9999" : cut+"-01").get(); count.assign = qa.docs.length; qa.docs.forEach(d => items.push(["assign", d.id]));
    count.photos = items.filter(x => x[0]==="photos").length;
    const lab = {photos:"ảnh (nếu có)", checks:"phiếu kiểm", approvals:"kết quả duyệt", daily:"báo cáo sản xuất", dappr:"duyệt báo cáo cũ", steps:"bước đầu ca", off:"ngày nghỉ", assign:"phân công cũ"};
    S.purge.plan = {items:items, desc:Object.keys(lab).filter(k => count[k]).map(k => count[k]+" "+T(lab[k])).join(", ") || T("không có")};
    if(!items.length){ S.purge.plan = null; toast(T("Không có dữ liệu nào cần xoá.")); }
  }catch(err){ toast(T("Chưa đọc được dữ liệu. Kiểm tra mạng rồi thử lại.")); }
  S.busy = false; renderSettings(); const el = $("#purgePw"); if(el) el.value = pw;
}
async function purgeRun(){
  const pg = S.purge; if(S.busy || !pg.plan || !purgePwOk()) return;
  S.busy = true; pg.running = true; renderSettings(); $("#purgePw").value = PURGE_PW;
  const items = pg.plan.items; let done = 0, fail = 0;
  for(let i=0; i<items.length; i+=25){
    await Promise.all(items.slice(i, i+25).map(([c,id]) => S.db.doc(c+"/"+id).delete().then(() => { done++; }, () => { fail++; })));
    const m = $("#purgeMsg"); if(m) m.textContent = T("Đang xoá… {a}/{b}",{a:done+fail, b:items.length}); }
  S.busy = false; pg.running = false; pg.plan = null; S.report.loaded = false; S.photos = new Map();
  toast(fail ? T("Đã xoá {n} bản ghi, {f} bản ghi chưa xoá được. Thử lại sau.",{n:done, f:fail}) : T("Đã xoá {n} bản ghi.",{n:done}));
  renderSettings();
}
$("#tab-settings").addEventListener("click", async e => {
  const pm = e.target.closest('input[name="purgeMode"]'); if(pm){ S.purge.mode = pm.value; S.purge.plan = null; const pw = $("#purgePw").value; renderSettings(); $("#purgePw").value = pw; return; }
  if(e.target.id==="purgeScan") return purgeScan();
  if(e.target.id==="sheetSave"){ const u = $("#sheetUrl").value.trim(); if(u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast(T("Link phải có dạng https://script.google.com/…/exec"));
    try{ await S.db.doc("config/sheet").set({url:u, at:new Date().toISOString(), by:S.me.name}); toast(T(u ? "Đã lưu link Google Sheet." : "Đã ngắt kết nối Google Sheet.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); } return; }
  if(e.target.id==="sheetTest"){ await sheetSend([{sheet:"Kiểm tra kết nối", key:"test", row:{"Thời gian":vnDT(new Date().toISOString()), "Người gửi":S.me.name, "Nội dung":"Kết nối từ app PVC hoạt động"}}]); return toast(T("Đã gửi thử. Mở Google Sheet xem tab “Kiểm tra kết nối”.")); }
  if(e.target.id==="sheetMonth") return sheetMonthSend(S.today.slice(0,7));
  if(e.target.id==="sheetPrev") return sheetMonthSend(prevMonth(S.today.slice(0,7)));
  if(e.target.id==="purgeRun") return purgeRun();
  if(e.target.id==="purgeCancel"){ S.purge.plan = null; return renderSettings(); }
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.ladd || b.dataset.ldel){ const kind = b.dataset.ladd || b.dataset.kind; let list = S[kind].slice();
    if(b.dataset.ladd){ const name = $("#new_"+kind).value.trim().replace(/[,;]/g," "); if(!name) return toast(T("Hãy nhập tên trước.")); if(list.includes(name)) return toast(T("Tên này đã có trong danh sách.")); list.push(name); }
    else { if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=T("Bấm lần nữa để xoá"); return; } list = list.filter(x => x!==b.dataset.ldel); }
    S.busy = true;
    try{ await S.db.doc(LISTS[kind].doc).set({list:list}); if(document.activeElement) document.activeElement.blur(); toast(T("Đã lưu cài đặt.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); }
    S.busy = false; return; }
  if(S.me.role!=="admin") return;
  const cfg = {autoAdded:true, logoAdded:true, machines:S.cfg.machines.map(x => Object.assign({}, x)), times:{S:Object.assign({},S.cfg.times.S), C:Object.assign({},S.cfg.times.C)}};
  if(b.id==="addMachine"){ const name = $("#newMachine").value.trim(); if(!name) return toast(T("Hãy nhập tên máy trước.")); cfg.machines.push({id:"m"+Date.now().toString(36), name:name}); }
  else if(b.dataset.del){ if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=T("Bấm lần nữa để xoá"); return; } cfg.machines = cfg.machines.filter(x => x.id!==b.dataset.del); }
  else if(b.dataset.savem){ const card = b.closest("[data-mc]"), g = k => card.querySelector('[data-f="'+k+'"]'), m = cfg.machines.find(x => x.id===b.dataset.savem);
    const name = g("name").value.trim(); if(!name) return toast(T("Hãy nhập tên máy trước."));
    m.name = name; m.two = g("two").checked;
    for(const k of ["tMin","tMax","t2Min","t2Max","sMin","sMax"]) m[k] = has(g(k).value.trim()) ? numOf(g(k).value) : null;
    if([["tMin","tMax"],["t2Min","t2Max"],["sMin","sMax"]].some(p => has(m[p[0]]) && has(m[p[1]]) && m[p[0]]>m[p[1]])) return toast(T("Khoảng chuẩn không hợp lệ: số “từ” phải nhỏ hơn số “đến”.")); }
  else if(b.id==="saveTimes"){ for(const s of ["S","C"]){ const f = $("#from"+s).value, d = $("#due"+s).value; if(!f || !d || toMin(f)>=toMin(d)) return toast(T("Ca {s}: giờ bắt đầu phải trước giờ hạn.",{s:shiftL(s)})); cfg.times[s] = {from:f, due:d}; } }
  else return;
  S.busy = true;
  try{ await S.db.doc("config/main").set(cfg); if(document.activeElement) document.activeElement.blur(); toast(T("Đã lưu cài đặt.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); }
  S.busy = false;
});

/* ---------- boot ---------- */
function prevMonth(ym){ const p = ym.split("-").map(Number), d = new Date(p[0], p[1]-2, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
async function start(){
  render();
  try{ await Promise.all([loadScript(FB_URL+"firebase-app-compat.js")]); await loadScript(FB_URL+"firebase-firestore-compat.js"); }catch(e){}
  S.downloads = true; S.ready = true;
  if(typeof firebase==="undefined"){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  try{ firebase.initializeApp(firebaseConfig);
    /* Lưu đệm dữ liệu trên máy: lần mở sau hiện ngay từ bộ nhớ đệm rồi mới đồng bộ, và vẫn xem được khi mạng chập chờn */
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
    S.db = makeDb(); }catch(e){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  S.sample = TRANSLATE_API_KEY ? true : null;
  const db = S.db;
  const fail = e => { if(e && e.code==="permission-denied"){ S.dbErr = "Firestore từ chối truy cập. Hãy mở quyền đọc/ghi cho collection này trong Security Rules rồi tải lại trang."; S.me = null; render(); } else toast(T("Mất kết nối dữ liệu. Tải lại trang.")); };
  db.collection("accounts").onSnapshot(q => { S.accounts = new Map(q.docs.map(d => [d.id, d.data()])); S.accLoaded = true; syncSession(); render(); if(S.me && S.tab==="report" && !S.report.loaded) loadReport(); }, fail);
  db.doc("config/sheet").onSnapshot(s => { const d = s.exists ? s.data() : {}; S.sheetUrl = d.url!==undefined ? d.url : DEFAULT_SHEET_URL; S.sheetAt = d.at || ""; sheetFlush(); if(S.tab==="settings" && !typingIn("#tab-settings")) renderSettings(); }, () => {});
  db.doc("config/main").onSnapshot(s => { const d = s.exists ? s.data() : {};
    /* Cấu hình đã lưu từ trước chưa có máy tự động thì thêm vào một lần; admin xoá đi thì không tự thêm lại */
    let saved = Array.isArray(d.machines) && d.machines.length ? d.machines : null;
    if(saved && !d.autoAdded && !saved.some(m => m.id==="m4")) saved = saved.concat([DEFAULT_MACHINES.find(m => m.id==="m4")]);
    if(saved && !d.logoAdded && !saved.some(m => m.id==="m5")){ const i4 = saved.findIndex(m => m.id==="m4"), lg = DEFAULT_MACHINES.find(m => m.id==="m5"); saved = i4<0 ? saved.concat([lg]) : saved.slice(0,i4).concat([lg], saved.slice(i4)); }
    S.cfg = {machines: saved || DEFAULT_MACHINES,
             times: {S:Object.assign({}, DEFAULT_TIMES.S, d.times && d.times.S), C:Object.assign({}, DEFAULT_TIMES.C, d.times && d.times.C)}};
    render(); }, fail);
  /* Theo dõi trực tiếp tháng này và tháng trước (để phiếu cuối tháng vẫn hiện ở tab Duyệt). */
  ["products","defects"].forEach(kind => db.doc(LISTS[kind].doc).onSnapshot(s => { const d = s.exists ? s.data() : {}; S[kind] = Array.isArray(d.list) ? d.list : []; render(); }, () => {}));
  const cur = S.today.slice(0,7), live = {checks:{}, approvals:{}, daily:{}, steps:{}, dappr:{}};
  [cur, prevMonth(cur)].forEach(ym => { ["checks","approvals","daily","steps","dappr"].forEach(c => {
    db.collection(c).where("month","==",ym).onSnapshot(q => { live[c][ym] = q.docs;
      const m = new Map(); Object.values(live[c]).forEach(ds => ds.forEach(d => m.set(d.id, d.data())));
      if(c==="checks") S.checks = m; else if(c==="approvals") S.apprs = m; else if(c==="daily") S.daily = m; else if(c==="dappr") S.dapprs = m; else { S.steps = m; paintSteps(); }
      render(); }, fail); }); });
  db.collection("tr").onSnapshot(q => { let n = 0; q.docs.forEach(d => { const o = d.data().out; if(o && S.tr.get(d.id)!==o){ S.tr.set(d.id, o); n++; } }); if(n) refresh(); }, () => {});
  S.week = mondayOf(S.today);
  if(S.db) S.db.collection("assign").where("adate",">=",addDays(S.today,-14)).limit(1000).onSnapshot(q => { S.assign = new Map(q.docs.map(d => [d.id, d.data()])); render(); }, () => {});
  if(S.db) S.db.collection("off").limit(1000).onSnapshot(q => { S.off = new Set(q.docs.map(d => d.id)); render(); if(S.me && S.tab==="report") renderReport(); }, () => {});
  setInterval(() => { sheetFlush(); if(isDevice() && S.op){ const idle = Date.now()-S.opAt; if((idle>180000 && !S.form.dirty && !S.sform.dirty && !typingIn("#tab-check")) || idle>900000) opOut(); }
    const t = ymd(new Date()); if(t!==S.today && !S.form.dirty && !S.dform.dirty && !S.sform.dirty){ S.today = t; render(); } else if(S.me && S.tab==="daily" && !S.dform.dirty && !typingIn("#tab-daily")) renderDaily(); }, 60000);
}
start();
})();
</script>
