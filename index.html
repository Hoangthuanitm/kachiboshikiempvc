<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kiểm tra máy in sấy PVC</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font tải nền, không chặn việc hiện trang; trong lúc chờ dùng font có sẵn của máy -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one narrow working column (phone at the machine first), sticky header with account + tabs,
   each tab is a stack of plain panels; the monthly grid mirrors the paper form (day rows x shift columns). */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#141a2d; --muted:#5a6379; --line:#d8ddea;
  --accent:#2440b3; --accent-ink:#ffffff; --accent-soft:#e5eafb;
  --ok:#12733f; --ok-soft:#dcf2e5; --ng:#bb261e; --ng-soft:#fde3e0; --wait:#8c5a08; --wait-soft:#fbedd0;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --jp:"Hiragino Sans","Yu Gothic","Noto Sans JP","Be Vietnam Pro",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark }

*{box-sizing:border-box}
/* Giao diện cố định trên điện thoại: không phóng to khi chạm 2 lần, không chụm để zoom, không tự zoom khi chạm vào ô nhập */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{overflow-x:hidden;touch-action:pan-x pan-y;overscroll-behavior-x:none}
button,.btn,.slot,.okng button,.tabs button,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.slot,.chip,.role,.tabs{-webkit-user-select:none;user-select:none}
/* iOS tự phóng to khi chạm vào ô nhập có chữ nhỏ hơn 16px: ép mọi ô nhập luôn 16px ở mọi cỡ màn hình */
input,select,textarea,input[type=text],input[type=password],input[type=month],input[type=time]{font-size:16px !important}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.top-in{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.brand{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.25;text-wrap:balance}
.brand .jp{font-family:var(--jp);font-size:12px;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;min-height:6px}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--wait-soft);color:var(--wait);font-size:12px;font-family:var(--mono)}

.wrap{padding-block:18px 48px}
.wrap section{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.narrow{max-width:420px;width:100%;margin-inline:auto}
.panel h2{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}
.notice{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px}
.alert{background:var(--ng-soft);color:var(--ng);border-radius:8px;padding:12px 14px;font-weight:600}
.alert .jp{font-family:var(--jp);font-weight:400;font-size:13px;display:block}

.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;min-width:0}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot b{font-size:14px}
.slot span{font-size:12px;color:var(--muted)}

.items{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .lbl{min-width:0;flex:1}
.item .lbl b{display:block;font-weight:600;font-size:14.5px}
.item .lbl span{font-family:var(--jp);font-size:12px;color:var(--muted)}
.item.pv{flex-wrap:wrap}
.item.pv .lbl{flex:1 1 100%}
.item.pv .std{display:block;font-family:var(--font);color:var(--accent);font-weight:600;font-size:12.5px}
.vals{display:flex;gap:6px;flex:1 1 120px;min-width:0}
.vals .num{min-width:0;height:46px;font-family:var(--mono);font-size:18px !important;text-align:center}
.rng{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto 1fr;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.rng input{text-align:center;font-family:var(--mono)}
.okng{display:flex;gap:6px;flex:none}
.okng button{width:58px;height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer}
.okng button[data-v="OK"][aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.okng button[data-v="NG"][aria-pressed="true"]{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.okng button:disabled{cursor:default;opacity:.75}

label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=month],input[type=time],select,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:400;color:var(--ink)}
input[type=file]{font-size:13px;max-width:100%}
textarea{min-height:70px;resize:vertical}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--ng);border-color:var(--ng)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;font-size:15px;color:var(--ng);border:2px dashed var(--ng);background:var(--ng-soft)}
.btn.cam.done{color:var(--ink);border:1.5px solid var(--line);background:var(--surface);min-height:46px}
.btn.cam svg{flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.vh:focus-visible + #photoPrev, .btn.cam:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.ng{border-color:var(--ng)}
.card .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.marks{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.mark{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.mark.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng);font-weight:600}
.photo{max-width:min(100%,420px);border-radius:8px;border:1px solid var(--line);display:block}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.sun td{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.li>div{min-width:0;overflow-wrap:anywhere}
.li.off{opacity:.6}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.day.off{opacity:.55}
.day.today{border-color:var(--accent)}
.dayh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.offt{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;padding:4px 10px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer}
.offt input{width:18px;height:18px;font-size:16px}
.dayg{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
select.asg{color:var(--muted)}
select.asg.set{color:var(--ink);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.orig{display:block;font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:9}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div id="brand"></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section id="login"></section>
  <section id="tab-check" hidden></section>
  <section id="tab-approve" hidden></section>
  <section id="tab-assign" hidden></section>
  <section id="tab-accounts" hidden></section>
  <section id="tab-report" hidden></section>
  <section id="tab-settings" hidden></section>
</main>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
/* Thư viện được tải SAU khi giao diện đã hiện, để trang mở lên ngay. Thư viện Excel chỉ tải khi bấm Xuất Excel. */
const FB_URL = "https://www.gstatic.com/firebasejs/10.12.2/";
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const loaded = {};
function loadScript(url){ return loaded[url] || (loaded[url] = new Promise((res, rej) => { const el = document.createElement("script"); el.src = url; el.async = true; el.onload = res; el.onerror = () => { delete loaded[url]; rej(new Error("load")); }; document.head.appendChild(el); })); }
/* ====== Firebase ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAfy4QMD9_7PyFHpInNdKDRWuW4AYCtLJ4",
  authDomain: "history-e4633.firebaseapp.com",
  projectId: "history-e4633",
  storageBucket: "history-e4633.firebasestorage.app",
  messagingSenderId: "331974436893",
  appId: "1:331974436893:web:10c3c6adf7b66d2b5fbef4",
  measurementId: "G-DC055090BW"
};
const COLLECTION = "kachiboshivnpvc";
/* Khoá Google Cloud Translation API để tự dịch ghi chú Việt <-> Nhật. Mặc định thử dùng apiKey của Firebase;
   nếu project chưa bật Cloud Translation API thì app chỉ hiện bản gốc. Đặt "" để tắt hẳn. */
const TRANSLATE_API_KEY = firebaseConfig.apiKey;
/* Mọi dữ liệu nằm trong MỘT collection; mỗi document có trường "type" và id có tiền tố theo loại. */
const TYPES = {checks:"check", approvals:"appr", accounts:"acc", photos:"photo", config:"config", tr:"tr", assign:"assign", off:"off"};
function makeDb(){
  const col = firebase.firestore().collection(COLLECTION);
  const wrap = (d, p) => ({id:d.id.slice(p.length), exists:d.exists, data:() => d.data()});
  return {
    doc(path){ const i = path.indexOf("/"), c = path.slice(0,i), p = TYPES[c]+"_", ref = col.doc(p+path.slice(i+1));
      return { set:d => ref.set(Object.assign({type:TYPES[c]}, d)), delete:() => ref.delete(), get:() => ref.get().then(s => wrap(s,p)),
               onSnapshot:(n,e) => ref.onSnapshot(s => n(wrap(s,p)), e) }; },
    /* "assign" lọc theo ngày (adate) nên không kèm điều kiện type, tránh phải tạo composite index */
    collection(c){ const p = TYPES[c]+"_"; let q = c==="assign" ? col : col.where("type","==",TYPES[c]);
      const docs = sn => sn.docs.filter(d => d.id.indexOf(p)===0).map(d => wrap(d,p));
      const api = { where(f,op,v){ q = q.where(f,op,v); return api; }, limit(n){ q = q.limit(n); return api; },
        get:() => q.get().then(sn => ({docs:docs(sn)})),
        onSnapshot:(n,e) => q.onSnapshot(sn => n({docs:docs(sn)}), e) };
      return api; }
  };
}
/* Chặn chụm-để-zoom trên iOS Safari (nơi bỏ qua user-scalable=no); chạm 2 lần đã bị tắt bằng touch-action trong CSS */
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if(e.touches.length>1) e.preventDefault(); }, {passive:false});
/* Sau khi rời ô nhập hoặc bấm nút: đặt lại viewport để trang trở về đúng tỉ lệ 1:1 nếu trình duyệt đã lỡ phóng to */
function resetZoom(){ const m = document.querySelector('meta[name="viewport"]'); if(!m) return; const c = m.getAttribute("content"); m.setAttribute("content", c+" "); setTimeout(() => m.setAttribute("content", c), 50); }
document.addEventListener("focusout", e => { if(e.target.matches && e.target.matches("input,select,textarea")) setTimeout(() => { const a = document.activeElement; if(!a || !/INPUT|SELECT|TEXTAREA/.test(a.tagName)) resetZoom(); }, 60); });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ITEMS = [
  {k:"temp", vi:"Kiểm tra nhiệt độ", short:"Nhiệt độ", jp:"温度", sj:"温度"},
  {k:"speed", vi:"Kiểm tra tốc độ băng chuyền", short:"Tốc độ", jp:"コンベアのスピードチェック", sj:"スピード"}
];
const DOW = {vi:["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"], ja:["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"]};
const DEFAULT_TIMES = {S:{from:"06:00", due:"08:00"}, C:{from:"12:00", due:"13:30"}};
const DEFAULT_MACHINES = [{id:"m1", name:"Máy in sấy PVC 1"}, {id:"m2", name:"Máy in sấy PVC 2"}, {id:"m3", name:"Máy in sấy PVC 3"}];
const TABS = {admin:["approve","assign","accounts","report","settings"], leader:["approve","assign","accounts"], worker:["check"]};
const TAB_LABEL = {check:"Kiểm máy", approve:"Duyệt", assign:"Phân công", accounts:"Tài khoản", report:"Tổng hợp tháng", settings:"Cài đặt"};
const ROLE_LABEL = {admin:"Admin", leader:"Tổ trưởng", worker:"Công nhân"};

/* Japanese UI text, keyed by the Vietnamese original */
const JA = {
"Danh mục kiểm tra máy in sấy PVC":"PVC加工機のチェック項目","Máy in sấy PVC":"PVC加工機",
"Kiểm máy":"点検","Duyệt":"承認","Tài khoản":"アカウント","Tổng hợp tháng":"月次集計","Cài đặt":"設定",
"Admin":"管理者","Tổ trưởng":"班長","Công nhân":"作業者","Chủ trang":"ページ所有者",
"Sáng":"午前","Chiều":"午後","Đăng xuất":"ログアウト","Đăng nhập":"ログイン",
"Đạt":"合格","Không đạt":"不合格","Đã duyệt":"承認済み","Trả lại – kiểm lại":"差し戻し・再点検","Chờ duyệt":"承認待ち",
"Đúng giờ":"時間内","Trễ {n} phút":"{n}分遅れ","Kiểm quá sớm":"早すぎる点検",
"Xem ảnh bằng chứng":"証拠写真を見る","Ảnh bằng chứng lỗi":"異常の証拠写真","Chưa tải được ảnh.":"写真を読み込めませんでした。",
"(đang dịch…)":"（翻訳中…）",
"Đang tải dữ liệu… Sau khi đăng nhập bằng ID và mật khẩu, công nhân nhập kết quả kiểm, tổ trưởng duyệt, admin xem tổng hợp tháng.":"データを読み込み中… IDとパスワードでログイン後、作業者は点検結果を入力し、班長が承認し、管理者が月次集計を確認します。",
"Chưa kết nối được dữ liệu":"データに接続できません","Kiểm tra mạng rồi tải lại trang.":"通信を確認して再読み込みしてください。",
"Thiết bị này đang mở trang ở quyền chỉ xem nên không lưu được dữ liệu. Nhờ chủ trang chia sẻ lại ở mức Contributor.":"この端末は閲覧権限のみのため保存できません。所有者にContributor権限での共有を依頼してください。",
"ID tài khoản":"アカウントID","Mật khẩu":"パスワード",
"Bạn là chủ trang. Lần đầu chưa có tài khoản nào, hãy vào bằng quyền chủ trang rồi tạo tài khoản ở tab Tài khoản.":"あなたはページ所有者です。初回はアカウントがないため、所有者権限で入り「アカウント」タブで作成してください。",
"Vào bằng quyền chủ trang (Admin)":"所有者権限で入る（管理者）",
"Đang tải danh sách tài khoản, thử lại sau vài giây.":"アカウント一覧を読み込み中です。数秒後にもう一度お試しください。",

const mName = n => n;
const meName = () => S.me.id==="owner" ? T("Chủ trang") : S.me.name;
const isJa = s => /[぀-ヿ一-鿿]/.test(s);
const needTr = s => (S.lang==="ja") !== isJa(s);
function trKey(s){ let a = 0x811c9dc5, b = 5381; for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); a = Math.imul(a^c, 16777619); b = (Math.imul(b,33)+c)|0; } return (a>>>0).toString(16)+"-"+(b>>>0).toString(16)+"-"+s.length; }
function trPlain(s){ if(!s || !needTr(s)) return s||""; return S.tr.get(trKey(s)) || s; }
function txt(s){
  if(!s) return ""; if(!needTr(s)) return esc(s);
  const k = trKey(s), o = S.tr.get(k);
  if(o) return esc(o)+'<span class="orig">'+esc(s)+'</span>';
  if(S.sample && !S.trTried.has(k)){ S.trQueue.add(s); clearTimeout(txt.h); txt.h = setTimeout(runTr, 700); return esc(s)+' <span class="sub">'+T("(đang dịch…)")+'</span>'; }
  return esc(s);
}
async function translateBatch(texts, target){
  const r = await fetch("https://translation.googleapis.com/language/translate/v2?key="+encodeURIComponent(TRANSLATE_API_KEY), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:texts, target:target, format:"text"})});
  if(!r.ok) throw new Error("translate "+r.status);
  return (await r.json()).data.translations.map(t => t.translatedText);
}
async function runTr(){
  if(S.trBusy || !S.trQueue.size || !S.sample) return;
  S.trBusy = true;
  const items = [...S.trQueue].slice(0,20); items.forEach(s => { S.trQueue.delete(s); S.trTried.add(trKey(s)); });
  try{
    for(const target of ["ja","vi"]){
      const part = items.filter(s => isJa(s) ? target==="vi" : target==="ja"); if(!part.length) continue;
      const out = await translateBatch(part, target);
      for(let i=0;i<part.length;i++){ const o = String(out[i]||"").trim(); if(!o) continue; const k = trKey(part[i]); S.tr.set(k, o);
        try{ await S.db.doc("tr/"+k).set({src:part[i], out:o}); }catch(e){} }
    }
  }catch(e){ S.sample = null; }
  S.trBusy = false; refresh();
  if(S.trQueue.size) setTimeout(runTr, 700);
}
function refresh(){ render(); if(S.me && S.tab==="report") renderReport(); }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{t.hidden=true;},3400); }
function stateOf(c, a){ if(!a || a.checkAt!==c.at) return "pending"; return a.status==="approved" ? "approved" : "returned"; }
function stateText(st){ return T(st==="approved" ? "Đã duyệt" : st==="returned" ? "Trả lại – kiểm lại" : "Chờ duyệt"); }
function stateChip(st){ return '<span class="chip '+(st==="approved"?"ok":st==="returned"?"ng":"wait")+'">'+stateText(st)+'</span>'; }
function resultText(c){ return T(isPass(c) ? "Đạt" : "Không đạt"); }
function resultChip(c){ return '<span class="chip '+(isPass(c)?"ok":"ng")+'">'+resultText(c)+'</span>'; }
function timingText(c){ return c.timing==="late" ? T("Trễ {n} phút",{n:c.lateMin}) : c.timing==="early" ? T("Kiểm quá sớm") : T("Đúng giờ"); }
function timingChip(c){ return '<span class="chip '+(c.timing==="late"?"ng":c.timing==="early"?"wait":"ok")+'">'+timingText(c)+'</span>'; }
function timingAt(shift, d){ const t = S.cfg.times[shift], m = d.getHours()*60+d.getMinutes();
  if(m > toMin(t.due)) return {timing:"late", lateMin:m-toMin(t.due)};
  if(m < toMin(t.from)) return {timing:"early", lateMin:0};
  return {timing:"ontime", lateMin:0}; }
const slotId = () => S.today+"_"+S.slot.shift+"_"+S.slot.machine;
const pendingList = () => [...S.checks.entries()].filter(([id,c]) => stateOf(c,S.apprs.get(id))==="pending").sort((a,b)=> a[1].at<b[1].at?1:-1);
const multi = () => S.cfg.machines.length>1;
function marks(c){ return ITEMS.map(i => '<span class="mark'+(c[i.k]==="NG"?" ng":"")+'">'+(S.lang==="ja"?i.sj:i.short)+' <b class="mono">'+esc(i.k==="temp" ? (c.tempVal||"")+(c.temp2Val?"/"+c.temp2Val:"")+"°C" : (c.speedVal||""))+'</b> '+sym(c[i.k])+'</span>').join("")+(c.product ? '<span class="mark">'+esc(c.product)+'</span>' : ''); }
function checkTitle(c){ return '<b><span class="mono">'+fmtDate(c.date)+'</span> · '+shiftL(c.shift)+(multi()?' · '+esc(mName(c.machineName)):'')+'</b>'; }
function photoBlock(id, c){ if(!c.hasPhoto) return ""; return S.photos.has(id) ? '<img class="photo" alt="'+T("Ảnh bằng chứng lỗi")+'" src="'+S.photos.get(id)+'">' : '<div><button class="btn sm" data-photo="'+esc(id)+'">'+T("Xem ảnh bằng chứng")+'</button></div>'; }
async function fetchPhoto(id){ if(S.photos.has(id)) return true; try{ const s = await S.db.doc("photos/"+id).get(); if(s.exists){ S.photos.set(id, s.data().data); return true; } }catch(e){} toast(T("Chưa tải được ảnh.")); return false; }

async function hashPw(salt, pw){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,"0")).join("");

/* ---------- shell ---------- */
function render(){
  const tabs = S.me ? TABS[S.me.role] : [];
  if(S.me && !tabs.includes(S.tab)) S.tab = tabs[0];
  const ja = S.lang==="ja";
  $("#brand").innerHTML = '<h1'+(ja?' style="font-family:var(--jp)"':'')+'>'+(ja?"PVC加工機のチェック項目":"Danh mục kiểm tra máy in sấy PVC")+'</h1><div class="jp">'+(ja?"Danh mục kiểm tra máy in sấy PVC":"PVC加工機のチェック項目")+'</div>';
  $("#who").innerHTML = (S.me ? '<span class="role">'+esc(meName())+' · '+roleL(S.me.role)+'</span>' : '')
    +'<button class="btn sm" id="langBtn" aria-label="Đổi ngôn ngữ / 言語切替">'+(ja?"Tiếng Việt":"日本語")+'</button>'
    +(S.me ? '<button class="btn sm" id="logout">'+T("Đăng xuất")+'</button>' : '');
  const n = S.me && S.me.role!=="worker" ? pendingList().length : 0;
  $("#tabs").innerHTML = tabs.map(t => '<button role="tab" data-tab="'+t+'" aria-selected="'+(S.tab===t)+'">'+T(TAB_LABEL[t])+(t==="approve"&&n?'<span class="badge">'+n+'</span>':'')+'</button>').join("");
  $("#login").hidden = !!S.me;
  ["check","approve","assign","accounts","report","settings"].forEach(t => { $("#tab-"+t).hidden = !S.me || S.tab!==t; });
  if(!S.me){ if(!typingIn("#login")) renderLogin(); return; }
  if(S.tab==="check" && !S.form.dirty){ loadForm(); renderCheck(); }
  if(S.tab==="approve" && !typingIn("#tab-approve")) renderApprove();
  if(S.tab==="assign" && !typingIn("#tab-assign")) renderAssign();
  if(S.tab==="accounts" && !typingIn("#tab-accounts")) renderAccounts();
  if(S.tab==="settings" && !typingIn("#tab-settings")) renderSettings();
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  S.tab = b.dataset.tab; lsSet("pvc_tab", S.tab); S.form.dirty = false; S.editAcc = null; render();
  if(S.tab==="report"){ renderReport(); loadReport(); }
});
$("#who").addEventListener("click", e => {
  if(e.target.id==="logout"){ S.me = null; lsSet("pvc_session", null); S.form.dirty=false; render(); }
  if(e.target.id==="langBtn"){ S.lang = S.lang==="ja" ? "vi" : "ja"; lsSet("pvc_lang", S.lang);
    if(document.activeElement) document.activeElement.blur();
    if(S.me && S.tab==="check" && S.form.dirty){ render(); renderCheck(); } else refresh(); }
});

/* ---------- login ---------- */

  const box = $("#login");
  if(!S.ready){ box.innerHTML = '<div class="panel narrow"><h2>'+T("Đăng nhập")+'</h2><div class="notice">'+T("Đang tải dữ liệu… Sau khi đăng nhập bằng ID và mật khẩu, công nhân nhập kết quả kiểm, tổ trưởng duyệt, admin xem tổng hợp tháng.")+'</div></div>'; return; }
  if(!S.db){ box.innerHTML = '<div class="panel narrow"><h2>'+T("Chưa kết nối được dữ liệu")+'</h2><div class="notice">'+T("Kiểm tra mạng rồi tải lại trang.")+'</div></div>'; return; }
  if(S.dbErr){ box.innerHTML = '<div class="panel narrow"><h2>'+T("Chưa kết nối được dữ liệu")+'</h2><div class="alert">'+T(S.dbErr)+'</div></div>'; return; }

      +'<label class="f" for="faId">'+T("ID đăng nhập")+'<input type="text" id="faId" autocapitalize="none"></label>'
      +'<label class="f" for="faName">'+T("Họ tên")+'<input type="text" id="faName"></label>'
      +'<label class="f" for="faPw">'+T("Mật khẩu")+'<input type="text" id="faPw" autocomplete="off" placeholder="'+T("ít nhất 4 ký tự")+'"></label>'
      +'<div class="row"><button class="btn pri" id="faBtn">'+T("Tạo Admin và đăng nhập")+'</button></div></div>'; return; }
  box.innerHTML = '<div class="panel narrow"><h2>'+T("Đăng nhập")+'</h2>'
    +(S.canWrite ? '' : '<div class="alert">'+T("Thiết bị này đang mở trang ở quyền chỉ xem nên không lưu được dữ liệu. Nhờ chủ trang chia sẻ lại ở mức Contributor.")+'</div>')
    +'<label class="f" for="lgId">'+T("ID tài khoản")+'<input type="text" id="lgId" autocomplete="username" autocapitalize="none"></label>'
    +'<label class="f" for="lgPw">'+T("Mật khẩu")+'<input type="password" id="lgPw" autocomplete="current-password"></label>'
    +'<div class="row"><button class="btn pri" id="lgBtn">'+T("Đăng nhập")+'</button></div>'
    +'</div>';
}
const OWNER = () => ({id:"owner", name:"Chủ trang", role:"admin", machines:[], shifts:["S","C"]});
async function doLogin(){
  const id = $("#lgId").value.trim().toLowerCase(), pw = $("#lgPw").value;
  if(!S.accLoaded) return toast(T("Đang tải danh sách tài khoản, thử lại sau vài giây."));
  const a = S.accounts.get(id);
  if(!a || !a.active || (await hashPw(a.salt, pw))!==a.hash) return toast(T("Sai ID hoặc mật khẩu, hoặc tài khoản đã bị khoá."));
  S.me = Object.assign({id:id}, a); lsSet("pvc_session", id); S.form.dirty=false;
  if(document.activeElement) document.activeElement.blur(); render();
  if(S.tab==="report") loadReport();
}
$("#login").addEventListener("click", e => {
  if(e.target.id==="lgBtn") doLogin();
  if(e.target.id==="faBtn") firstAdmin();
});
$("#login").addEventListener("keydown", e => { if(e.key==="Enter" && (e.target.id==="lgPw" || e.target.id==="lgId")) doLogin(); });
async function firstAdmin(){
  if(S.busy) return;
  const id = $("#faId").value.trim().toLowerCase(), name = $("#faName").value.trim(), pw = $("#faPw").value;
  if(!/^[a-z0-9._-]{3,20}$/.test(id)) return toast(T("ID gồm 3–20 ký tự: chữ thường không dấu, số, dấu . _ -"));
  if(S.accounts.has(id)) return toast(T("ID này đã có. Chọn ID khác."));
  if(!name) return toast(T("Hãy nhập họ tên."));
  if(pw.length<4) return toast(T("Mật khẩu cần ít nhất 4 ký tự."));
  S.busy = true;
  try{ const salt = newSalt(), doc = {name:name, role:"admin", active:true, machines:[], shifts:["S","C"], salt:salt, hash:await hashPw(salt,pw), createdBy:id, createdByName:name, updatedAt:new Date().toISOString()};
    await S.db.doc("accounts/"+id).set(doc); S.accounts.set(id, doc); S.me = Object.assign({id:id}, doc); lsSet("pvc_session", id); S.tab = "accounts";
    if(document.activeElement) document.activeElement.blur(); render(); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được tài khoản. Thử lại.")); }
  S.busy = false;
}
function syncSession(){
  if(S.me && S.me.id!=="owner"){ const a = S.accounts.get(S.me.id); if(!a || !a.active){ S.me=null; lsSet("pvc_session",null); toast(T("Tài khoản đã bị khoá hoặc xoá.")); } else S.me = Object.assign({id:S.me.id}, a); }
  if(!S.me){ const sid = lsGet("pvc_session");
    if(sid==="owner" && S.isOwner) S.me = OWNER();
    else if(sid && S.accounts.has(sid) && S.accounts.get(sid).active) S.me = Object.assign({id:sid}, S.accounts.get(sid)); }
}

/* ---------- check tab ---------- */
function mySlots(){
  const out = [];
  if(isOff(S.today)) return out;
  S.cfg.machines.forEach(m => { ["S","C"].forEach(sh => {
    const as = S.assign.get(S.today+"_"+sh+"_"+m.id);
    if(as && as.workerId){ if(as.workerId!==S.me.id) return; }
    else if(!defaultFor(S.me, sh, m.id)) return;
    out.push({shift:sh, machine:m.id, name:m.name}); }); });
  return out;
}
function loadForm(){
  const c = S.checks.get(slotId());
  S.form.vals = {}; ITEMS.forEach(i => { if(c && c[i.k]) S.form.vals[i.k]=c[i.k]; });
  S.form.nums = {temp:c ? (c.tempVal||"") : "", temp2:c ? (c.temp2Val||"") : "", speed:c ? (c.speedVal||"") : ""};
  S.form.product = c ? (c.product||"") : "";
  S.form.note = c ? (c.note||"") : ""; S.form.photo = null; S.form.dirty = false;
}
/* Giá trị đo và khoảng chuẩn của từng máy */
const curMachine = () => S.cfg.machines.find(x => x.id===S.slot.machine) || {};
const numOf = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const has = v => v!==null && v!==undefined && v!=="";
function rangeText(lo, hi){ return has(lo) && has(hi) ? lo+" – "+hi : has(lo) ? "≥ "+lo : has(hi) ? "≤ "+hi : ""; }
function limitsOf(mc, k){ return k==="temp" ? [["temp", mc.tMin, mc.tMax]].concat(mc.two ? [["temp2", mc.t2Min, mc.t2Max]] : []) : [["speed", mc.sMin, mc.sMax]]; }
/* Nếu máy có đặt khoảng chuẩn: tự đánh giá OK/× theo số đã nhập. Trả null khi chưa đủ dữ liệu để đánh giá. */
function judge(mc, k){ let any = false, bad = false;
  for(const [f, lo, hi] of limitsOf(mc, k)){ if(!has(lo) && !has(hi)) continue; const v = S.form.nums[f]; if(!has(v)) return null; any = true;
    const n = numOf(v); if(n===null || (has(lo) && n<lo) || (has(hi) && n>hi)) bad = true; }
  return any ? (bad ? "NG" : "OK") : null; }
function valText(c){ return (c.tempVal||"")+(c.temp2Val ? "/"+c.temp2Val : "")+"°C · "+(c.speedVal||""); }
function noteLabel(anyNG){ return T(anyNG ? "Ghi chú (bắt buộc khi có ×)" : "Ghi chú"); }
function renderCheck(){
  const box = $("#tab-check"), slots = mySlots(), ja = S.lang==="ja";
  if(isOff(S.today)){ box.innerHTML = '<div class="panel"><h2>'+dowOf(S.today)+', <span class="mono">'+fmtDate(S.today)+'</span></h2><div class="notice">'+T("Hôm nay là ngày nghỉ. Không cần kiểm máy.")+'</div></div>'; return; }
  if(!slots.length){ box.innerHTML = '<div class="panel"><h2>'+T("Chưa được phân công")+'</h2><div class="notice">'+T("Hôm nay bạn chưa được phân công ca kiểm nào. Hãy báo tổ trưởng nếu chưa đúng.")+'</div></div>'; return; }
  if(!slots.some(s => s.shift===S.slot.shift && s.machine===S.slot.machine)){ S.slot = {shift:slots[0].shift, machine:slots[0].machine}; loadForm(); }
  const stWord = {pending:"chờ duyệt", approved:"đã duyệt", returned:"trả lại"};
  const slotHtml = slots.map(s => { const id = S.today+"_"+s.shift+"_"+s.machine, c = S.checks.get(id);
    const t = !c ? T("Chưa kiểm") : resultText(c)+" · "+T(stWord[stateOf(c,S.apprs.get(id))]);
    const due = ja ? S.cfg.times[s.shift].due+" まで" : "trước "+S.cfg.times[s.shift].due;
    return '<button class="slot" data-shift="'+s.shift+'" data-m="'+esc(s.machine)+'" aria-pressed="'+(S.slot.shift===s.shift&&S.slot.machine===s.machine)+'"><b>'+shiftL(s.shift)+' <span class="mono">'+due+'</span>'+(multi()?' · '+esc(mName(s.name)):'')+'</b><span>'+t+'</span></button>'; }).join("");
  const id = slotId(), c = S.checks.get(id), a = S.apprs.get(id), st = c ? stateOf(c,a) : null;
  const locked = st==="approved", f = S.form, anyNG = ITEMS.some(i => f.vals[i.k]==="NG"), t = S.cfg.times[S.slot.shift];
  const mc = curMachine();
  const numIn = (k, ph) => '<input type="text" inputmode="decimal" class="num" data-num="'+k+'" value="'+esc(f.nums[k]||"")+'" placeholder="'+ph+'" aria-label="'+ph+'"'+(locked?" disabled":"")+'>';
  const items = ITEMS.map(i => { const rg = limitsOf(mc, i.k).map(l => rangeText(l[1], l[2])).filter(Boolean).join(" / ");
    return '<div class="item pv"><div class="lbl"><b'+(ja?' style="font-family:var(--jp)"':'')+'>'+esc(ja?i.jp:i.vi)+'</b><span>'+esc(ja?i.vi:i.jp)+'</span>'+(rg ? '<span class="std">'+T("Chuẩn:")+' '+esc(rg)+'</span>' : '')+'</div>'
    +'<div class="vals">'+(i.k==="temp" ? numIn("temp", mc.two ? T("Nhiệt độ 1 (°C)") : T("Nhiệt độ (°C)"))+(mc.two ? numIn("temp2", T("Nhiệt độ 2 (°C)")) : '') : numIn("speed", T("Tốc độ")))+'</div>'
    +'<div class="okng" data-k="'+i.k+'">'
    +'<button type="button" data-v="OK" aria-pressed="'+(f.vals[i.k]==="OK")+'"'+(locked?" disabled":"")+'>OK</button>'
    +'<button type="button" data-v="NG" aria-label="'+T("Không đạt")+'" aria-pressed="'+(f.vals[i.k]==="NG")+'"'+(locked?" disabled":"")+'>×</button></div></div>'; }).join("")
    +'<label class="f" for="product" style="margin-top:12px">'+T("Hàng / chất liệu đang chạy")+'<input type="text" id="product" value="'+esc(f.product)+'" placeholder="'+T("Ví dụ: Poly, Cotton, Kinari, 15G…")+'"'+(locked?" disabled":"")+'></label>';
  let status;
  if(c){ status = '<div class="row">'+resultChip(c)+timingChip(c)+stateChip(st)+'</div><div class="sub">'+T("{name} kiểm lúc",{name:esc(c.checker)})+' <span class="mono">'+fmtTime(c.firstAt)+'</span> ('+T("quy định trước")+' <span class="mono">'+esc(c.due)+'</span>)</div>';
    if(st==="returned" && a.note) status += '<div class="notice">'+T("Tổ trưởng trả lại:")+' '+txt(a.note)+'</div>';
    if(st==="approved" && a.action) status += '<div class="notice">'+T("Biện pháp đã thực hiện:")+' '+txt(a.action)+'</div>'; }
  else { const tm = timingAt(S.slot.shift, new Date());
    status = '<div class="row">'+(tm.timing==="late" ? '<span class="chip ng">'+T("Đã quá giờ quy định {n} phút",{n:tm.lateMin})+'</span>' : tm.timing==="early" ? '<span class="chip wait">'+T("Chưa tới giờ kiểm ca này")+'</span>' : '<span class="chip ok">'+T("Đang trong giờ quy định")+'</span>')
      +'</div><div class="sub">'+T("Ca {s} phải kiểm xong trước {due}, tính từ {from}. Giờ kiểm được ghi tự động khi lưu.",{s:shiftL(S.slot.shift), due:t.due, from:t.from})+'</div>'; }
  const havePhoto = f.photo || (c && c.hasPhoto && S.photos.get(id)), alt = T("Ảnh bằng chứng lỗi");
  box.innerHTML =
    '<div class="panel"><div><h2>'+dowOf(S.today)+', <span class="mono">'+fmtDate(S.today)+'</span></h2><div class="sub">'+T("Kiểm 2 lần mỗi ngày: buổi sáng trước khi in sấy và sau giờ nghỉ trưa.")+'</div></div><div class="slots">'+slotHtml+'</div></div>'

function compressImage(file){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { let side = 1100, q = 0.72, out = "";
        for(let i=0;i<6;i++){ const k = Math.min(1, side/Math.max(img.width,img.height)), cv = document.createElement("canvas");
          cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          out = cv.toDataURL("image/jpeg", q); if(out.length < 220000) break; side = Math.round(side*0.8); q -= 0.08; }
        out.length < 240000 ? res(out) : rej(new Error("big")); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}

async function saveCheck(){

  if(anyNG && !f.note.trim()) return toast(T("Có kết quả ×: hãy ghi chú bất thường."));

  ITEMS.forEach(i => { doc[i.k] = f.vals[i.k]; });
  doc.tempVal = f.nums.temp; doc.temp2Val = mc0.two ? f.nums.temp2 : ""; doc.speedVal = f.nums.speed; doc.product = f.product.trim();

  try{
    if(anyNG && f.photo){ await S.db.doc("photos/"+id).set({data:f.photo, at:doc.at}); S.photos.set(id, f.photo); }
    await S.db.doc("checks/"+id).set(doc); S.form.dirty = false;
    toast(anyNG ? T("Đã lưu. Báo ngay cho cơ điện và tổ trưởng.") : tm.timing==="late" ? T("Đã lưu. Lần kiểm này trễ {n} phút.",{n:tm.lateMin}) : T("Đã lưu kết quả kiểm."));

  S.busy = false;
}

function isSunday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===0; }
function isSaturday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===6; }
/* Ngày không cần kiểm: mọi Chủ nhật, và Thứ bảy nào được tổ trưởng đánh dấu là ngày nghỉ */
function isOff(s){ return isSunday(s) || S.off.has(s); }
function addDays(s, n){ const p = s.split("-").map(Number); return ymd(new Date(p[0], p[1]-1, p[2]+n)); }
function mondayOf(s){ const p = s.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]); return addDays(s, -((d.getDay()+6)%7)); }
function workerList(){ return [...S.accounts.entries()].filter(([,a]) => a.role==="worker" && a.active).sort((x,y) => x[1].name.localeCompare(y[1].name)); }
function defaultFor(a, sh, mid){ return (!a.machines || !a.machines.length || a.machines.includes(mid)) && (!a.shifts || a.shifts.includes(sh)); }
function renderAssign(){
  const box = $("#tab-assign"), ws = workerList(), days = [0,1,2,3,4,5].map(i => addDays(S.week, i)), ms = S.cfg.machines;
  let h = '<div class="panel"><div class="row between"><h2>'+T("Phân công theo tuần")+'</h2><div class="row"><button class="btn sm" data-wk="-7" aria-label="'+T("Tuần trước")+'">◀</button><span class="mono">'+fmtDate(days[0]).slice(0,5)+' – '+fmtDate(days[5])+'</span><button class="btn sm" data-wk="7" aria-label="'+T("Tuần sau")+'">▶</button></div></div>'
    +'<div class="sub">'+T("Chọn người kiểm cho từng buổi. Ô để “Theo mặc định” thì áp dụng phân công cố định trong tài khoản. Khi công nhân nghỉ, chọn người thay cho đúng buổi đó.")+' '+T("Chủ nhật không cần phân công. Thứ bảy nào nghỉ thì đánh dấu “Ngày nghỉ” để không phải kiểm.")+'</div>';
  if(!ws.length){ box.innerHTML = h+'<div class="notice">'+T("Chưa có tài khoản công nhân nào. Tạo ở tab Tài khoản trước.")+'</div></div>'; return; }
  const opts = sel => ws.map(([id,a]) => '<option value="'+esc(id)+'"'+(id===sel?" selected":"")+'>'+esc(a.name)+'</option>').join("");
  h += '<div class="card"><b>'+T("Điền nhanh")+'</b><div class="row"><select id="qfWorker" class="grow" aria-label="'+T("Chọn công nhân")+'"><option value="">— '+T("Chọn công nhân")+' —</option>'+opts(S.qfWorker)+'</select>'
    +(ms.length>1 ? '<select id="qfMachine" class="grow" aria-label="'+T("Máy")+'">'+ms.map(m => '<option value="'+esc(m.id)+'"'+(m.id===S.qfMachine?" selected":"")+'>'+esc(mName(m.name))+'</option>').join("")+'</select>' : '')+'</div>'
    +'<div class="row"><button class="btn sm" data-qf="SC">'+T("Cả tuần")+'</button><button class="btn sm" data-qf="S">'+T("Các buổi sáng")+'</button><button class="btn sm" data-qf="C">'+T("Các buổi chiều")+'</button><button class="btn sm warn" data-qf="clear">'+T("Xoá phân công tuần này")+'</button></div></div>';
  h += '<div class="list">';
  days.forEach(date => { const past = date<S.today, sat = isSaturday(date), off = S.off.has(date);
    h += '<div class="day'+(past?" off":"")+(date===S.today?" today":"")+'"><div class="dayh"><span><b>'+dowOf(date)+'</b> <span class="mono">'+fmtDate(date).slice(0,5)+'</span></span>'
      +(sat ? '<label class="offt"><input type="checkbox" data-off="'+date+'"'+(off?" checked":"")+(past?" disabled":"")+'>'+T("Ngày nghỉ")+'</label>' : '')+'</div><div class="dayg">';
    if(off) h += '<div class="notice" style="grid-column:1/-1">'+T("Ngày nghỉ – không cần kiểm máy.")+'</div>';
    else ms.forEach(m => { ["S","C"].forEach(sh => { const key = date+"_"+sh+"_"+m.id, as = S.assign.get(key), sel = as ? as.workerId : "";
      const def = ws.filter(([,a]) => defaultFor(a, sh, m.id)).map(([,a]) => a.name).join(", ") || T("(chưa có ai)");
      h += '<label class="f">'+shiftL(sh)+(ms.length>1?' · '+esc(mName(m.name)):'')+'<select class="asg'+(sel?" set":"")+'" data-as="'+esc(key)+'"'+(past?" disabled":"")+'>'
        +'<option value="">'+esc(T("Mặc định: {n}",{n:def}))+'</option>'+opts(sel)
        +(sel && !ws.some(([id]) => id===sel) ? '<option value="'+esc(sel)+'" selected>'+esc(as.workerName||sel)+'</option>' : '')+'</select></label>'; }); });
    h += '</div></div>'; });
  box.innerHTML = h+'</div></div>';
}
async function setAssign(key, wid){
  if(!wid) return S.db.doc("assign/"+key).delete();
  const p = key.split("_");
  return S.db.doc("assign/"+key).set({adate:p[0], shift:p[1], machineId:p[2], workerId:wid, workerName:(S.accounts.get(wid)||{}).name||wid, by:S.me.id, at:new Date().toISOString()});
}
$("#tab-assign").addEventListener("change", async e => {
  const el = e.target;
  if(el.id==="qfWorker"){ S.qfWorker = el.value; return; }
  if(el.id==="qfMachine"){ S.qfMachine = el.value; return; }
  if(el.dataset.off){ el.blur(); const d = el.dataset.off;
    try{ if(el.checked) await S.db.doc("off/"+d).set({date:d, month:d.slice(0,7), by:S.me.id, at:new Date().toISOString()}); else await S.db.doc("off/"+d).delete(); toast(T("Đã lưu phân công.")); }
    catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
    return; }
  if(!el.dataset.as) return;
  el.blur();
  try{ await setAssign(el.dataset.as, el.value); toast(T("Đã lưu phân công.")); }catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
});
$("#tab-assign").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.wk){ S.week = addDays(S.week, +b.dataset.wk); return renderAssign(); }
  const qf = b.dataset.qf; if(!qf) return;
  if(qf==="clear" && b.dataset.sure!=="1"){ b.dataset.sure = "1"; b.textContent = T("Bấm lần nữa để xoá"); return; }
  const wid = S.qfWorker || "", mid = S.cfg.machines.length>1 ? (S.qfMachine || S.cfg.machines[0].id) : S.cfg.machines[0].id;
  if(qf!=="clear" && !wid) return toast(T("Hãy chọn công nhân trước."));
  S.busy = true; if(document.activeElement) document.activeElement.blur();
  try{
    for(let i=0;i<7;i++){ const date = addDays(S.week, i); if(date<S.today) continue;
      if(qf!=="clear" && isOff(date)) continue;
      for(const sh of ["S","C"]){
        if(qf==="clear"){ for(const m of S.cfg.machines){ const k = date+"_"+sh+"_"+m.id; if(S.assign.has(k)) await setAssign(k, ""); } }
        else if(qf.includes(sh)) await setAssign(date+"_"+sh+"_"+mid, wid); } }
    toast(T("Đã lưu phân công."));
  }catch(err){ toast(T("Chưa lưu được phân công.")); }
  S.busy = false; renderAssign();
});

/* ---------- report tab ---------- */
function loadReport(){
  if(!S.db) return;
  const r = S.report, ym = r.month;
  if(r.sub===ym) return;
  (r.unsubs||[]).forEach(u => { try{ u(); }catch(e){} });
  r.sub = ym; r.loaded = false; r.gotC = r.gotA = false;
  const done = () => { if(r.sub!==ym) return; r.loaded = r.gotC && r.gotA; if(S.me && S.tab==="report") renderReport(); };
  const fail = () => { if(r.sub===ym){ r.sub = null; toast(T("Chưa tải được dữ liệu tháng. Thử lại.")); } };
  r.unsubs = [
    S.db.collection("checks").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.checks = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => x.id<y.id?-1:1); r.gotC = true; done(); }, fail),
    S.db.collection("approvals").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.apprs = new Map(q.docs.map(d => [d.id, d.data()])); r.gotA = true; done(); }, fail)
  ];
}
function reportStats(){
  const r = S.report, t = {total:r.checks.length, pass:0, fail:0, ontime:0, late:0, early:0, approved:0, pending:0, returned:0};
  r.checks.forEach(c => { isPass(c) ? t.pass++ : t.fail++; t[c.timing||"ontime"]++; t[stateOf(c, r.apprs.get(c.id))]++; });
  return t;
}
function reportMachines(){
  const m = new Map(S.cfg.machines.map(x => [x.id, x.name]));
  S.report.checks.forEach(c => { if(!m.has(c.machineId)) m.set(c.machineId, c.machineName); });
  return [...m.entries()].map(([id,name]) => ({id:id, name:mName(name)}));
}
function renderReport(){
  const box = $("#tab-report"), r = S.report, t = reportStats(), ms = reportMachines();
  const [y,mo] = r.month.split("-").map(Number), days = new Date(y,mo,0).getDate();
  const by = new Map(r.checks.map(c => [c.id, c]));
  const tile = (n, label, color) => '<div class="tile"><b'+(color?' style="color:var(--'+color+')"':'')+'>'+n+'</b><span>'+T(label)+'</span></div>';
  let h = '<div class="panel"><div class="row between"><label class="f" for="month">'+T("Tháng báo cáo")+'<input type="month" id="month" value="'+r.month+'"></label>'
    +'<div class="row">'+(S.downloads ? '<button class="btn pri sm" id="xlsx"'+(t.total?"":" disabled")+'>'+T("Xuất Excel")+'</button>' : '')+'</div></div>'
    +(S.downloads ? '' : '<div class="notice">'+T("Trình xem này không cho tải file. Hãy mở trang trên trình duyệt máy tính để xuất Excel.")+'</div>')
    +'<div class="tiles">'+tile(t.total,"Lần kiểm đã ghi")+tile(t.pass,"Đạt")+tile(t.fail,"Không đạt","ng")+tile(t.ontime,"Đúng giờ")+tile(t.late,"Trễ giờ","ng")+tile(t.pending+t.returned,"Chưa duyệt xong","wait")+'</div></div>';
  h += '<div class="panel"><h2>'+T("Bảng theo ngày")+'</h2>';
  if(!r.loaded) h += '<div class="notice">'+T("Đang tải dữ liệu tháng…")+'</div>';
  else if(!t.total) h += '<div class="notice">'+T("Tháng này chưa có lần kiểm nào được ghi.")+'</div>';
  else { h += '<div class="scroll"><table><tr><th>'+T("Ngày")+'</th><th>'+T("Thứ")+'</th>'+ms.map(m => '<th>'+(ms.length>1?esc(m.name)+' · ':'')+T("Sáng")+'</th><th>'+(ms.length>1?esc(m.name)+' · ':'')+T("Chiều")+'</th>').join("")+'</tr>';
    for(let d=1; d<=days; d++){ const date = r.month+"-"+pad(d), sun = isOff(date);
      h += '<tr'+(sun?' class="sun"':'')+'><td class="d">'+pad(d)+'/'+pad(mo)+'</td><td>'+dowOf(date)+'</td>';
      ms.forEach(m => { ["S","C"].forEach(sh => { const c = by.get(date+"_"+sh+"_"+m.id);
        h += '<td>'+(c ? resultChip(c)+' <b class="mono">'+esc(valText(c))+'</b> <span class="mono sub">'+fmtTime(c.firstAt)+'</span>'+(c.timing&&c.timing!=="ontime" ? ' '+timingChip(c) : '')+(stateOf(c,r.apprs.get(c.id))==="approved" ? '' : ' <span class="chip plain">'+T("chưa duyệt")+'</span>') : (sun ? '<span class="chip plain">'+T("Nghỉ")+'</span>' : '<span class="sub">—</span>'))+'</td>'; }); });
      h += '</tr>'; }
    h += '</table></div>'; }
  h += '</div>';
  const bad = r.checks.filter(c => !isPass(c));
  if(bad.length){ h += '<div class="panel"><h2>'+T("Các lần không đạt")+'</h2>';
    bad.forEach(c => { const a = r.apprs.get(c.id), st = stateOf(c,a);
      h += '<div class="card ng"><div class="head">'+checkTitle(c)+stateChip(st)+'</div><div class="marks">'+marks(c)+'</div><div class="sub">'+esc(c.checker)+' · <span class="mono">'+fmtTime(c.firstAt)+'</span></div><div>'+T("Ghi chú:")+' '+txt(c.note)+'</div>'
        +(st==="approved" ? '<div>'+T("Biện pháp đã thực hiện:")+' '+txt(a.action)+' <span class="sub">('+esc(a.approver)+')</span></div>' : '')+photoBlock(c.id,c)+'</div>'; });
    h += '</div>'; }
  box.innerHTML = h;
}
function onMonth(e){ const v = e.target.value; if(e.target.id!=="month" || !/^\d{4}-\d{2}$/.test(v) || v===S.report.month) return;
  S.report.month = v; S.report.loaded = false; S.report.checks = []; S.report.apprs = new Map(); loadReport();
  if(e.type==="change"){ e.target.blur(); renderReport(); } }
$("#tab-report").addEventListener("change", onMonth);
$("#tab-report").addEventListener("input", onMonth);
$("#tab-report").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.photo){ b.disabled = true; await fetchPhoto(b.dataset.photo); return renderReport(); }
  if(b.id==="xlsx") exportXlsx();
});
async function exportXlsx(){
  if(typeof XLSX==="undefined"){ toast(T("Đang chuẩn bị file Excel…")); try{ await loadScript(XLSX_URL); }catch(e){} }
  if(typeof XLSX==="undefined") return toast(T("Chưa tải được thư viện Excel. Tải lại trang rồi thử lại."));
  const r = S.report, t = reportStats(), xnum = v => { const n = numOf(v); return has(v) && n!==null && /^\s*-?\d+([.,]\d+)?\s*$/.test(v) ? n : (v||""); };
  const rows = [["Ngày","Thứ","Ca","Giờ quy định (trước)","Giờ kiểm thực tế","Đúng giờ","Trễ (phút)","Máy","Nhiệt độ","Nhiệt độ 2","KQ nhiệt độ","Tốc độ băng chuyền","KQ tốc độ","Hàng / chất liệu","Kết quả","Người thực hiện","ID người thực hiện","Ghi chú lỗi","Ảnh bằng chứng","Trạng thái duyệt","Người duyệt","Thời gian duyệt","Biện pháp đã thực hiện","Lý do trả lại"].map(x => T(x))];
  r.checks.forEach(c => { const a = r.apprs.get(c.id), st = stateOf(c,a), cur = st!=="pending";
    rows.push([fmtDate(c.date), dowOf(c.date), shiftL(c.shift), c.due||"", fmtTime(c.firstAt), timingText(c), c.lateMin||0, mName(c.machineName), xnum(c.tempVal), xnum(c.temp2Val), sym(c.temp), xnum(c.speedVal), sym(c.speed), c.product||"", resultText(c), c.checker, c.checkerId||"", trPlain(c.note), c.hasPhoto?T("Có"):"", stateText(st), cur?a.approver:"", cur?fmtDT(a.at):"", cur?trPlain(a.action):"", cur?trPlain(a.note):""]); });
  const sum = [[T("Danh mục kiểm tra máy in sấy PVC")+" - "+T("Tổng hợp tháng {m}",{m:r.month.slice(5)+"/"+r.month.slice(0,4)})],[],[T("Chỉ tiêu"),T("Số lượng")],[T("Lần kiểm đã ghi"),t.total],[T("Đạt"),t.pass],[T("Không đạt"),t.fail],[T("Đúng giờ"),t.ontime],[T("Trễ giờ"),t.late],[T("Kiểm quá sớm"),t.early],[T("Đã duyệt"),t.approved],[T("Chờ duyệt"),t.pending],[T("Trả lại"),t.returned],[],[T("Theo người thực hiện"),T("Lần kiểm"),T("Đúng giờ"),T("Trễ giờ"),T("Không đạt")]];
  const people = new Map(); r.checks.forEach(c => { const k = c.checker; if(!people.has(k)) people.set(k,[0,0,0,0]); const p = people.get(k); p[0]++; if((c.timing||"ontime")==="ontime") p[1]++; if(c.timing==="late") p[2]++; if(!isPass(c)) p[3]++; });
  people.forEach((p,k) => sum.push([k].concat(p)));
  sum.push([],[T("Theo máy"),T("Lần kiểm"),T("Đạt"),T("Không đạt")]);
  reportMachines().forEach(m => { const cs = r.checks.filter(c => c.machineId===m.id); sum.push([m.name, cs.length, cs.filter(isPass).length, cs.filter(c => !isPass(c)).length]); });
  const wb = XLSX.utils.book_new(), w1 = XLSX.utils.aoa_to_sheet(sum), w2 = XLSX.utils.aoa_to_sheet(rows);
  w1["!cols"] = [{wch:44},{wch:12},{wch:10},{wch:10},{wch:12}];
  w2["!cols"] = [12,11,8,18,16,14,10,20,10,11,12,16,11,20,12,20,16,36,14,14,20,18,40,30].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, w1, T("Tổng hợp")); XLSX.utils.book_append_sheet(wb, w2, T("Chi tiết"));
  try{ XLSX.writeFile(wb, "Kiem-tra-may-PVC_"+r.month+(S.lang==="ja"?"_JP":"")+".xlsx"); toast(T("Đã xuất file Excel.")); }
  catch(err){ toast(T("Chưa xuất được file. Thử lại sau ít phút.")); }
}

  else return;
  S.busy = true;
  try{ await S.db.doc("config/main").set(cfg); if(document.activeElement) document.activeElement.blur(); toast(T("Đã lưu cài đặt.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); }
  S.busy = false;
});

/* ---------- boot ---------- */
function prevMonth(ym){ const p = ym.split("-").map(Number), d = new Date(p[0], p[1]-2, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
async function start(){
  render();
  try{ await Promise.all([loadScript(FB_URL+"firebase-app-compat.js")]); await loadScript(FB_URL+"firebase-firestore-compat.js"); }catch(e){}
  S.downloads = true; S.ready = true;
  if(typeof firebase==="undefined"){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  try{ firebase.initializeApp(firebaseConfig);
    /* Lưu đệm dữ liệu trên máy: lần mở sau hiện ngay từ bộ nhớ đệm rồi mới đồng bộ, và vẫn xem được khi mạng chập chờn */
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
    S.db = makeDb(); }catch(e){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  S.sample = TRANSLATE_API_KEY ? true : null;
  const db = S.db;
  const fail = e => { if(e && e.code==="permission-denied"){ S.dbErr = "Firestore từ chối truy cập. Hãy mở quyền đọc/ghi cho collection này trong Security Rules rồi tải lại trang."; S.me = null; render(); } else toast(T("Mất kết nối dữ liệu. Tải lại trang.")); };
  db.collection("accounts").onSnapshot(q => { S.accounts = new Map(q.docs.map(d => [d.id, d.data()])); S.accLoaded = true; syncSession(); render(); if(S.me && S.tab==="report" && !S.report.loaded) loadReport(); }, fail);
  db.doc("config/main").onSnapshot(s => { const d = s.exists ? s.data() : {};
    S.cfg = {machines: Array.isArray(d.machines) && d.machines.length ? d.machines : DEFAULT_MACHINES,
             times: {S:Object.assign({}, DEFAULT_TIMES.S, d.times && d.times.S), C:Object.assign({}, DEFAULT_TIMES.C, d.times && d.times.C)}};
    render(); }, fail);
  /* Theo dõi trực tiếp tháng này và tháng trước (để phiếu cuối tháng vẫn hiện ở tab Duyệt). */
  const cur = S.today.slice(0,7), live = {checks:{}, approvals:{}};
  [cur, prevMonth(cur)].forEach(ym => { ["checks","approvals"].forEach(c => {
    db.collection(c).where("month","==",ym).onSnapshot(q => { live[c][ym] = q.docs;
      const m = new Map(); Object.values(live[c]).forEach(ds => ds.forEach(d => m.set(d.id, d.data())));
      if(c==="checks") S.checks = m; else S.apprs = m; render(); }, fail); }); });
  db.collection("tr").onSnapshot(q => { let n = 0; q.docs.forEach(d => { const o = d.data().out; if(o && S.tr.get(d.id)!==o){ S.tr.set(d.id, o); n++; } }); if(n) refresh(); }, () => {});
  S.week = mondayOf(S.today);
  if(S.db) S.db.collection("assign").where("adate",">=",addDays(S.today,-14)).limit(1000).onSnapshot(q => { S.assign = new Map(q.docs.map(d => [d.id, d.data()])); render(); }, () => {});
  if(S.db) S.db.collection("off").limit(1000).onSnapshot(q => { S.off = new Set(q.docs.map(d => d.id)); render(); if(S.me && S.tab==="report") renderReport(); }, () => {});
  setInterval(() => { const t = ymd(new Date()); if(t!==S.today && !S.form.dirty){ S.today = t; render(); } }, 60000);
}
start();
})();
</script>
